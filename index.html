<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나노디자인</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f3f5f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나노디자인">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#1b2333; --sub:#5b6577; --line:#e3e7ef;
  --pri:#2563eb; --pri-soft:#e8f0ff;
  --green:#15803d; --green-soft:#e6f6ec;
  --orange:#c2410c; --orange-soft:#fff1e6;
  --gray:#64748b; --gray-soft:#eef1f5;
  --red:#b91c1c; --red-soft:#fdecec;
  --purple:#7c3aed; --purple-soft:#f1eafe;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:20;background:rgba(243,245,249,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;flex:none}
.brand img{display:block;height:26px;width:auto}
.ttl{font-weight:800;font-size:19px;line-height:1.2}
.ttl small{display:block;font-weight:500;font-size:13px;color:var(--sub)}
.who{margin-left:auto;font-size:14px;color:var(--sub);text-align:right}
.who b{color:var(--ink)}
.who{white-space:nowrap}
@media(max-width:480px){.ttl small{display:none}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;text-decoration:none;color:var(--sub);font-size:13px;font-weight:700}
nav.tabs a .ic{font-size:22px;line-height:1}
nav.tabs a.on{color:var(--pri)}
nav.tabs a.on .ic{transform:scale(1.08)}
h1.page{font-size:26px;font-weight:800;margin:22px 0 4px}
p.lead{margin:0 0 18px;color:var(--sub)}
h2.sec{font-size:19px;font-weight:800;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:639px){.g4{grid-template-columns:repeat(2,1fr)}}
.stat{display:block;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:16px;text-decoration:none;color:inherit}
.stat .k{font-size:15px;color:var(--sub);font-weight:700}
.stat .v{font-size:32px;font-weight:800;line-height:1.15;margin-top:4px}
.stat .s{font-size:14px;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;min-height:48px;background:var(--pri);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.big{width:100%;font-size:17px;min-height:54px}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 11px;font-size:14px;font-weight:700;white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)}
.b-blue{background:var(--pri-soft);color:var(--pri)}
.b-orange{background:var(--orange-soft);color:var(--orange)}
.b-gray{background:var(--gray-soft);color:var(--gray)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-purple{background:var(--purple-soft);color:var(--purple)}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%;text-align:left}
.item .main{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:18px}
.item .meta{font-size:15px;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.item .arrow{color:#9aa3b2;font-size:22px}
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px 16px;border:1px solid}
.alert .ic{font-size:22px;line-height:1.3}
.alert.warn{background:var(--orange-soft);border-color:#fbd5b8}
.alert.info{background:var(--pri-soft);border-color:#c9dafc}
.alert.ok{background:var(--green-soft);border-color:#bfe6cc}
.alert.err{background:var(--red-soft);border-color:#f5c2c2}
.alert b{display:block}
.empty{text-align:center;color:var(--sub);padding:28px 12px;border:2px dashed var(--line);border-radius:var(--r);background:#fff}
.empty .ic{font-size:36px}
/* guide */
.gsec{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.gsec>summary{list-style:none;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.gsec>summary::-webkit-details-marker{display:none}
.gnum{width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.gnum.done{background:var(--green)}
.gsec .gt{font-weight:800;font-size:18px;flex:1}
.gsec .gp{font-size:14px;color:var(--sub);font-weight:700}
.gbody{border-top:1px solid var(--line);padding:6px 16px 16px}
.gdesc{background:var(--gray-soft);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--sub);margin:10px 0}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid #b8c0cf;background:#fff;flex:none;display:grid;place-items:center;font-size:18px;color:#fff;margin-top:1px}
.chk.on{background:var(--green);border-color:var(--green)}
.step .st{font-weight:700}
.step.on .st{color:var(--sub);text-decoration:line-through}
.step .sd{font-size:15px;color:var(--sub);white-space:pre-wrap}
.step .sw{font-size:14px;color:var(--purple);font-weight:700;margin-top:2px}
.bar{height:12px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
/* seats */
.zone{margin-bottom:18px}
.zone h3{margin:0 0 10px;font-size:17px;font-weight:800}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.seat{border-radius:14px;padding:10px 8px;min-height:84px;text-align:center;border:2px solid;display:flex;flex-direction:column;justify-content:center;gap:2px}
.seat .sn{font-size:13px;font-weight:800;opacity:.8}
.seat .sp2{font-size:16px;font-weight:800;word-break:keep-all}
.seat.free{background:#fff;border-color:#cfe9d7;border-style:dashed;color:var(--green)}
.seat.used{background:var(--pri-soft);border-color:#bcd0fb;color:#1e3a8a}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:640px){.sheet{border-radius:22px}}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:800}
.sheet .hint{color:var(--sub);font-size:15px;margin:0 0 14px}
.f{margin-bottom:14px}
.f label{display:block;font-weight:700;margin-bottom:6px}
.f label em{font-style:normal;color:var(--sub);font-weight:500;font-size:14px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid #cdd4e0;border-radius:12px;padding:12px;background:#fff;font-size:16px}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:3px solid #bfd3ff;border-color:var(--pri)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:2px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-weight:700;background:#fff}
.opt.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:16px}
.kv dt{color:var(--sub);font-weight:700}
.kv dd{margin:0;font-weight:500;word-break:break-all}
.hist{border-left:3px solid var(--line);padding-left:14px;margin-left:6px}
.hist div{padding:6px 0;font-size:15px}
.hist small{color:var(--sub);display:block}
.erow{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fafbfd}
.erow .row input{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1b2333;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:70;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.ro{background:#fff7e6;border-bottom:1px solid #f6dfae;color:#8a5a00;font-size:15px;padding:8px 16px;text-align:center}
.help li{margin-bottom:6px}
.muted{color:var(--sub)}
.tag-admin{font-size:12px;background:var(--purple-soft);color:var(--purple);border-radius:6px;padding:1px 6px;font-weight:800;margin-left:4px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a href="#home" class="brand" aria-label="나노디자인 홈"><img src="logo-nano.png" alt="NANO"></a>
  <div class="ttl">나노디자인<small>테라타워 입주가이드 · PC · 좌석 · 인원</small></div>
  <div class="who" id="who"></div>
</div><div id="robar"></div></header>

<main class="wrap" id="view"></main>

<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- 기본 설정 ---------- */
const TABS=[
  {id:"home",ic:"🏠",t:"홈"},
  {id:"guide",ic:"📋",t:"입주가이드"},
  {id:"pcs",ic:"💻",t:"PC"},
  {id:"seats",ic:"🪑",t:"좌석"},
  {id:"people",ic:"👥",t:"사람"},
  {id:"manage",ic:"⚙️",t:"관리"}
];
const PC_ST={
  "사용중":{c:"b-blue",d:"누군가 쓰고 있어요"},
  "대기":{c:"b-green",d:"남는 PC (바로 쓸 수 있어요)"},
  "반출":{c:"b-orange",d:"테라타워 밖으로 나갔어요"},
  "점검":{c:"b-gray",d:"고장·수리·점검 중"}
};
const P_ST={
  "테라타워 근무":{c:"b-blue"},
  "외부 과제":{c:"b-orange"},
  "대기":{c:"b-gray"}
};
/* 구글 시트 서버 주소 (Apps Script 웹 앱 URL) */
const API_URL="https://script.google.com/macros/s/AKfycbxokzOXuXIKK8JgQ-DIxe3tTZ_B5UC8_ba744RRRR54Sl6YNhk2eaxZl8J_byK4wQZ3wA/exec";
const S={
  view:"home", api:"", pw:"", adminPw:"", adminOk:false, busy:false,
  connected:false, slow:false, err:null,
  pcs:[], people:[], seats:[], guide:null, progress:{}, admins:[], myPid:null,
  got:{}, pcFilter:"전체", pcQ:"", pQ:"", pFilter:"전체", guideEdit:false, names:{}
};
const LS_KEY="nd_me_pid", LS_PW="nd_pw", LS_ADMIN="nd_admin", LS_API="nd_api";
const ls={get(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k);}catch(e){}}};

/* ---------- 도우미 ---------- */
const $=id=>document.getElementById(id);
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function dday(dateStr){
  if(!dateStr) return null;
  const t=new Date(today()+"T00:00:00"), e=new Date(dateStr+"T00:00:00");
  return Math.round((e-t)/86400000);
}
function ddayText(n){ if(n==null) return ""; if(n===0) return "오늘 종료"; return n>0?`D-${n}`:`${-n}일 지남`; }
function fmtDate(s){ if(!s) return "-"; const [y,m,d]=s.split("-"); return `${y}.${m}.${d}`; }
function uidGen(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const t=$("toast"); t.innerHTML=`<div class="toast">${h(msg)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML="",2600); }
const person=id=>S.people.find(p=>p.id===id);
const pname=id=>{const p=person(id);return p?p.name:"";};
const isAdmin=()=>S.adminOk;
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"","ko");
const natural=(a,b)=>String(a).localeCompare(String(b),"ko",{numeric:true});

/* ---------- 서버(구글 시트) ---------- */
async function api(body){
  const r=await fetch(S.api,{method:"POST",body:JSON.stringify(Object.assign({pw:S.pw,admin:S.adminPw||undefined},body)),redirect:"follow"});
  if(!r.ok) throw {code:"net"};
  const j=await r.json();
  if(!j.ok) throw {code:j.code||"err"};
  return j;
}
function applyData(d,admin){
  const arr=o=>Object.keys(o||{}).map(id=>Object.assign({},o[id],{id}));
  S.pcs=arr(d.pcs); S.people=arr(d.people); S.seats=arr(d.seats);
  S.progress={}; Object.keys(d.progress||{}).forEach(id=>S.progress[id]=(d.progress[id].done)||{});
  S.guide=(d.guide||{}).main||null;
  S.adminOk=!!admin;
  if(!admin&&S.adminPw){ S.adminPw=""; ls.set(LS_ADMIN,""); }
  S.connected=true; S.slow=false; S.err=null;
}
function hasModalInput(){ const a=document.activeElement; return !!($("modal").innerHTML&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
async function load(quiet){
  if(!S.api){ S.err="noapi"; render(); return; }
  if(!S.pw){ S.err="login"; render(); return; }
  if(S.busy) return;
  const timer=setTimeout(()=>{ if(!S.connected){ S.slow=true; render(); } },10000);
  try{
    const j=await api({action:"all"}); applyData(j.data,j.admin);
    if(!(quiet&&hasModalInput())) render();
  }catch(e){
    if(e.code==="auth"){ S.pw=""; ls.set(LS_PW,""); S.err="login"; S.connected=false; render(); }
    else if(!S.connected){ S.err="sub"; render(); }
    console.warn(e);
  }finally{ clearTimeout(timer); }
}
/* 바꾸기: fn(db) 안에서 db.doc("모음/아이디").set(...) / .delete() 를 모아 한 번에 보내요 */
async function write(fn,okMsg){
  if(!S.connected){ toast("아직 연결되지 않았어요. 잠시 후 다시 해 주세요."); return false; }
  const ops=[];
  const db={doc(path){ const i=path.indexOf("/"), col=path.slice(0,i), id=path.slice(i+1);
    return {set:async d=>{ops.push({op:"set",col,id,data:d});}, delete:async()=>{ops.push({op:"del",col,id});}}; }};
  try{
    await fn(db);
    if(!ops.length) return true;
    S.busy=true;
    const j=await api({action:"batch",ops});
    applyData(j.data,j.admin);
    if(okMsg) toast(okMsg);
    render();
    return true;
  }catch(e){
    if(e&&e.code==="admin") toast("관리자만 할 수 있어요. ‘관리’에서 관리자 모드를 켜 주세요.");
    else if(e&&e.code==="auth"){ toast("비밀번호가 바뀌었어요. 다시 들어와 주세요."); S.pw=""; ls.set(LS_PW,""); S.err="login"; render(); }
    else toast("저장하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.");
    console.warn(e); S.busy=false; load(true); return false;
  }finally{ S.busy=false; }
}
function start(){
  S.api=API_URL||ls.get(LS_API); S.pw=ls.get(LS_PW); S.adminPw=ls.get(LS_ADMIN);
  const v=ls.get(LS_KEY); if(v) S.myPid=v;
  load();
  setInterval(()=>{ if(document.visibilityState==="visible") load(true); },30000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") load(true); });
}
function setMe(pid){
  S.myPid=pid||null; ls.set(LS_KEY,pid||"");
  render(); toast(pid?`'${pname(pid)}'(으)로 설정했어요`:"선택을 해제했어요");
}

/* ---------- 화면 공통 ---------- */
function renderTop(){
  const me=S.myPid&&person(S.myPid);
  $("who").innerHTML=me?`<b>${h(me.name)}</b>님${isAdmin()?'<span class="tag-admin">관리자</span>':""}`:(isAdmin()?'<span class="tag-admin">관리자</span>':"");
  $("robar").innerHTML="";
  $("tabs").innerHTML=TABS.map(t=>`<a href="#${t.id}" class="${S.view===t.id?"on":""}"><span class="ic">${t.ic}</span>${t.t}</a>`).join("");
}
function render(){
  renderTop();
  const v=$("view");
  if(S.err==="noapi"){ v.innerHTML=`<h1 class="page">서버 연결 설정</h1><p class="lead">구글 시트 웹 앱 주소(…/exec)를 넣어 주세요. 한 번만 하면 돼요.</p><div class="f"><input id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec"></div><button class="btn big" onclick="App.saveApi()">저장</button>`; $("tabs").innerHTML=""; return; }
  if(S.err==="login"){ v.innerHTML=`<div style="text-align:center;margin:40px 0 20px"><img src="logo-nano.png" alt="NANO" style="height:56px"><h1 class="page" style="margin-top:14px">나노디자인</h1><p class="lead">팀 비밀번호를 넣어 주세요. 한 번 넣으면 이 휴대폰에서는 다시 묻지 않아요.</p></div><div class="f"><input id="loginPw" type="password" placeholder="팀 비밀번호" onkeydown="if(event.key==='Enter')App.login()"></div><button class="btn big" onclick="App.login()">들어가기</button><p class="muted" style="text-align:center;font-size:15px">비밀번호는 팀 리더에게 물어보세요.</p>`; $("tabs").innerHTML=""; return; }
  const loading=!S.connected;
  let html="";
  if(loading){
    html+=S.slow?`<div class="alert warn" style="margin-top:16px"><span class="ic">⏳</span><div><b>데이터를 아직 못 불러왔어요.</b>인터넷 연결을 확인해 주세요. 연결되면 자동으로 나타나요.</div></div>`
               :`<div class="alert info" style="margin-top:16px"><span class="ic">⏳</span><div><b>불러오는 중이에요…</b></div></div>`;
  }
  if(S.err==="sub") html+=`<div class="alert err" style="margin-top:12px"><span class="ic">⚠️</span><div><b>데이터를 불러오지 못했어요.</b>인터넷 연결을 확인하고 새로고침해 주세요.</div></div>`;
  const fn={home:vHome,guide:vGuide,pcs:vPcs,seats:vSeats,people:vPeople,manage:vManage}[S.view]||vHome;
  v.innerHTML=html+fn();
}

/* ---------- 입주가이드 ---------- */
function gSections(){ return (S.guide&&Array.isArray(S.guide.sections))?S.guide.sections:[]; }
function vGuide(){
  const secs=gSections(), done=(S.myPid&&S.progress[S.myPid])||{};
  const all=secs.reduce((n,s)=>n+(s.steps||[]).length,0);
  const fin=secs.reduce((n,s)=>n+(s.steps||[]).filter(st=>done[st.id]).length,0);
  let o=`<h1 class="page">📋 입주가이드</h1><p class="lead">테라타워에 처음 오면 위에서부터 차례대로 하면 돼요. 끝낸 일은 네모를 눌러 ✔ 표시하세요.</p>`;
  if(isAdmin()) o+=`<div class="row" style="margin-bottom:14px"><button class="btn ${S.guideEdit?"":"ghost"}" onclick="App.toggleGuideEdit()">${S.guideEdit?"✅ 편집 끝내기":"✏️ 가이드 내용 고치기"}</button>${S.guideEdit?`<button class="btn soft" onclick="App.editSection(-1)">＋ 새 단계 묶음 추가</button>`:""}</div>`;
  if(!S.myPid&&secs.length) o+=`<div class="alert info" style="margin-bottom:14px"><span class="ic">🙋</span><div style="flex:1"><b>체크하려면 내 이름을 먼저 골라 주세요</b><div style="margin-top:8px"><button class="btn sm" onclick="App.pickMe()">내 이름 고르기</button></div></div></div>`;
  else if(S.myPid&&all) o+=`<div class="card" style="margin-bottom:14px"><div class="row"><b>내 진행 상황</b><span class="sp"></span><b style="color:var(--green)">${fin} / ${all}</b></div><div class="bar" style="margin-top:8px"><i style="width:${all?Math.round(fin/all*100):0}%"></i></div>${fin===all?'<div style="margin-top:8px;color:var(--green);font-weight:700">🎉 모두 끝냈어요! 팀 리더에게 완료를 알려 주세요.</div>':""}</div>`;
  if(!secs.length) return o+`<div class="empty"><div class="ic">📄</div><b>아직 가이드가 없어요.</b><br>${isAdmin()?"위의 ‘가이드 내용 고치기’를 눌러 만들어 주세요.":"관리자가 곧 채워 줄 거예요."}</div>`;
  secs.forEach((s,i)=>{
    const steps=s.steps||[], sf=steps.filter(st=>done[st.id]).length, allDone=steps.length&&sf===steps.length;
    o+=`<details class="gsec" ${S.guideEdit||(!allDone&&i===firstOpen(secs,done))?"open":""}><summary><span class="gnum ${allDone&&S.myPid?"done":""}">${allDone&&S.myPid?"✔":i+1}</span><span class="gt">${h(s.title)}</span><span class="gp">${S.myPid?`${sf}/${steps.length}`:`${steps.length}개`}</span></summary><div class="gbody">`;
    if(s.desc) o+=`<div class="gdesc">${h(s.desc)}</div>`;
    steps.forEach(st=>{
      const on=!!done[st.id];
      o+=`<div class="step ${on?"on":""}"><button class="chk ${on?"on":""}" aria-label="완료 표시" onclick="App.toggleStep('${h(st.id)}')" ${S.myPid?"":"disabled"}>${on?"✔":""}</button><div><div class="st">${h(st.title)}</div>${st.desc?`<div class="sd">${linkify(st.desc)}</div>`:""}${st.who?`<div class="sw">🙋 담당·문의: ${h(st.who)}</div>`:""}</div></div>`;
    });
    if(S.guideEdit) o+=`<div class="row" style="margin-top:12px"><button class="btn sm soft" onclick="App.editSection(${i})">✏️ 이 묶음 고치기</button><button class="btn sm ghost" onclick="App.moveSection(${i},-1)" ${i===0?"disabled":""}>▲ 위로</button><button class="btn sm ghost" onclick="App.moveSection(${i},1)" ${i===secs.length-1?"disabled":""}>▼ 아래로</button><span class="sp"></span><button class="btn sm danger" onclick="App.delSection(${i})">삭제</button></div>`;
    o+=`</div></details>`;
  });
  return o;
}
function linkify(t){ return h(t).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener" style="color:var(--pri);word-break:break-all">${u}</a>`); }
function firstOpen(secs,done){ for(let i=0;i<secs.length;i++){ const st=secs[i].steps||[]; if(!st.length||st.some(x=>!done[x.id])) return i; } return -1; }

function vSeats(){
  const zones={}; S.seats.forEach(s=>{ const z=s.zone||"기타"; (zones[z]=zones[z]||[]).push(s); });
  const used=S.seats.filter(s=>s.personId).length;

  o+=`<div class="card" style="margin-bottom:16px"><div class="row"><b>사용 중 ${used}석 · 빈자리 ${S.seats.length-used}석</b><span class="sp"></span>${isAdmin()?`<button class="btn sm" onclick="App.addSeats()">＋ 좌석 만들기</button>`:""}</div></div>`;
  if(!S.seats.length) return o+`<div class="empty"><div class="ic">🪑</div><b>등록된 좌석이 없어요.</b><br>${isAdmin()?"‘＋ 좌석 만들기’로 구역과 번호를 한 번에 만들 수 있어요.":"관리자가 좌석을 만들면 여기에 보여요."}</div>`;

    const arr=zones[z].sort((a,b)=>natural(a.num,b.num));
    o+=`<div class="zone"><h3>📍 ${h(z)} <span class="muted" style="font-weight:500;font-size:15px">(${arr.filter(s=>s.personId).length}/${arr.length})</span></h3><div class="seats">`+

  });
  return o;
}

function closeModal(){ $("modal").innerHTML=""; document.body.style.overflow=""; }
function personOptions(sel,emptyLabel){
  return `<option value="">${emptyLabel||"(아무도 없음)"}</option>`+S.people.slice().sort(byName).map(p=>`<option value="${h(p.id)}" ${p.id===sel?"selected":""}>${h(p.name)}${p.status&&p.status!=="테라타워 근무"?" ("+h(p.status)+")":""}</option>`).join("");
}
function optButtons(name,list,cur){
  return `<div class="opts" data-opt="${name}">`+list.map(k=>`<button type="button" class="opt ${k===cur?"on":""}" data-v="${h(k)}" onclick="App.opt(this)">${h(k)}</button>`).join("")+`</div><input type="hidden" id="${name}" value="${h(cur||"")}">`;
}
const val=id=>{const e=$(id);return e?e.value.trim():"";};

const App={
  close:closeModal,
  opt(btn){ const g=btn.parentElement; g.querySelectorAll(".opt").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); $(g.dataset.opt).value=btn.dataset.v; },
  pcFilter(k){ S.pcFilter=k; if(S.view==="pcs") render(); },
  pcSearch(v){ S.pcQ=v; const el=$("pclist"); if(!el){ render(); focusSearch(); return; } render(); focusSearch(); },
  pFilter(k){ S.pFilter=k; render(); },
  pSearch(v){ S.pQ=v; render(); focusSearch(); },

  /* 나 */
  pickMe(){
    if(!S.people.length){ openModal(`<h3>내 이름 고르기</h3><p class="hint">아직 등록된 사람이 없어요. ‘사람’ 화면에서 먼저 추가해 주세요.</p><div class="actions"><button class="btn" onclick="App.close();location.hash='#people'">사람 추가하러 가기</button></div>`); return; }
    openModal(`<h3>🙋 나는 누구인가요?</h3><p class="hint">목록에서 내 이름을 골라 주세요. 없으면 ‘사람’ 화면에서 먼저 추가하세요.</p><div class="f"><select id="mePid">${personOptions(S.myPid,"(선택 안 함)")}</select></div><div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn" onclick="App.saveMe()">저장</button></div>`);
  },
  saveMe(){ setMe(val("mePid")); closeModal(); },

  /* 가이드 */
  toggleGuideEdit(){ S.guideEdit=!S.guideEdit; render(); },
  async toggleStep(stepId){
    if(!S.myPid){ App.pickMe(); return; }
    const cur=Object.assign({},S.progress[S.myPid]||{});
    if(cur[stepId]) delete cur[stepId]; else cur[stepId]=true;
    S.progress[S.myPid]=cur; render();
    await write(db=>db.doc("progress/"+S.myPid).set({done:cur,updated:today()}));
  },
  editSection(i){
    if(!isAdmin()) return;
    const s=i>=0?JSON.parse(JSON.stringify(gSections()[i])):{id:uidGen(),title:"",desc:"",steps:[{id:uidGen(),title:"",desc:"",who:""}]};
    App._sec={i,s}; App._drawSec();
  },
  _drawSec(){
    const {i,s}=App._sec;
    openModal(`<h3>${i>=0?"✏️ 단계 묶음 고치기":"＋ 새 단계 묶음"}</h3><p class="hint">예: ‘PC 반입하기’처럼 큰 단계 하나에 할 일을 여러 개 넣어요.</p>
      <div class="f"><label>묶음 이름</label><input id="secTitle" value="${h(s.title)}" placeholder="예) PC 반입하기"></div>
      <div class="f"><label>설명 <em>(선택)</em></label><textarea id="secDesc" placeholder="예) 출근 3일 전까지 해야 해요">${h(s.desc||"")}</textarea></div>
      <label style="font-weight:700;display:block;margin-bottom:8px">할 일 목록</label>
      ${s.steps.map((st,k)=>`<div class="erow"><div class="row" style="margin-bottom:8px"><b style="min-width:24px">${k+1}.</b><input class="search" style="padding:9px 10px" data-k="${k}" data-f="title" value="${h(st.title)}" placeholder="할 일 (예: 반입 신청서 작성)"></div>
        <textarea class="search" style="min-height:60px;padding:9px 10px;margin-bottom:8px" data-k="${k}" data-f="desc" placeholder="자세한 설명 (선택)">${h(st.desc||"")}</textarea>
        <div class="row"><input class="search" style="flex:1;padding:9px 10px" data-k="${k}" data-f="who" value="${h(st.who||"")}" placeholder="담당·문의 (선택, 예: 팀 리더)"><button type="button" class="btn sm ghost" onclick="App._stepMove(${k},-1)" ${k===0?"disabled":""}>▲</button><button type="button" class="btn sm ghost" onclick="App._stepMove(${k},1)" ${k===s.steps.length-1?"disabled":""}>▼</button><button type="button" class="btn sm danger" onclick="App._stepDel(${k})">삭제</button></div></div>`).join("")}
      <button type="button" class="btn soft" style="width:100%" onclick="App._stepAdd()">＋ 할 일 추가</button>
      <div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn" onclick="App._secSave()">저장</button></div>`);
  },
  _collectSec(){
    const s=App._sec.s; s.title=val("secTitle"); s.desc=val("secDesc");
    document.querySelectorAll("[data-k]").forEach(el=>{ s.steps[+el.dataset.k][el.dataset.f]=el.value; });
  },
  _stepAdd(){ App._collectSec(); App._sec.s.steps.push({id:uidGen(),title:"",desc:"",who:""}); App._drawSec(); },
  _stepDel(k){ App._collectSec(); App._sec.s.steps.splice(k,1); App._drawSec(); },
  _stepMove(k,d){ App._collectSec(); const a=App._sec.s.steps; [a[k],a[k+d]]=[a[k+d],a[k]]; App._drawSec(); },
  async _secSave(){
    App._collectSec(); const {i,s}=App._sec;
    if(!s.title){ toast("묶음 이름을 써 주세요"); return; }
    s.steps=s.steps.map(st=>({id:st.id,title:st.title.trim(),desc:(st.desc||"").trim(),who:(st.who||"").trim()})).filter(st=>st.title);
    const secs=JSON.parse(JSON.stringify(gSections()));
    if(i>=0) secs[i]=s; else secs.push(s);
    if(await write(db=>db.doc("guide/main").set({sections:secs,updated:today()}),"가이드를 저장했어요")) closeModal();
  },
  async moveSection(i,d){ const secs=JSON.parse(JSON.stringify(gSections())); [secs[i],secs[i+d]]=[secs[i+d],secs[i]]; await write(db=>db.doc("guide/main").set({sections:secs,updated:today()})); },
  delSection(i){
    const s=gSections()[i];
    openModal(`<h3>정말 지울까요?</h3><p class="hint">‘${h(s.title)}’ 묶음과 그 안의 할 일 ${(s.steps||[]).length}개가 지워져요.</p><div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn danger" onclick="App._delSec(${i})">지우기</button></div>`);
  },
  async _delSec(i){ const secs=JSON.parse(JSON.stringify(gSections())); secs.splice(i,1); if(await write(db=>db.doc("guide/main").set({sections:secs,updated:today()}),"지웠어요")) closeModal(); },

  /* PC */
  pcDetail(id){
    const p=S.pcs.find(x=>x.id===id); if(!p) return;
    const st=PC_ST[p.status]||{c:"b-gray",d:""}, hist=(p.history||[]).slice().reverse();
    openModal(`<div class="row"><h3 style="flex:1">💻 ${h(p.name)}</h3><span class="badge ${st.c}">${h(p.status||"-")}</span></div><p class="hint">${h(st.d||"")}</p>
      <button class="btn big" onclick="App.changeUser('${h(id)}')">🔁 사용자 바꾸기</button>
      <dl class="kv" style="margin:18px 0">
        <dt>지금 사용자</dt><dd>${pname(p.personId)?h(pname(p.personId)):"-"}</dd>
        <dt>과제</dt><dd>${h(p.project||"-")}</dd>
        <dt>위치</dt><dd>${h(p.place||"-")}</dd>
        <dt>모델</dt><dd>${h(p.model||"-")}</dd>
        <dt>반입일</dt><dd>${fmtDate(p.inDate)}</dd>
        <dt>메모</dt><dd style="white-space:pre-wrap">${h(p.note||"-")}</dd>
      </dl>
      <b>📜 바뀐 기록</b>
      ${hist.length?`<div class="hist" style="margin-top:8px">${hist.map(x=>`<div><b>${h(x.from||"없음")} → ${h(x.to||"없음")}</b>${x.memo?" · "+h(x.memo):""}<small>${fmtDate(x.date)}${x.status?" · "+h(x.status):""}${x.by?" · 기록: "+h(x.by):""}</small></div>`).join("")}</div>`:`<p class="muted">아직 기록이 없어요.</p>`}
      <div class="actions"><button class="btn ghost" onclick="App.editPc('${h(id)}')">✏️ 정보 고치기</button>${isAdmin()?`<button class="btn danger" onclick="App.delPc('${h(id)}')">삭제</button>`:""}</div>
      <div class="actions" style="margin-top:8px"><button class="btn ghost" onclick="App.close()">닫기</button></div>`);
  },
  changeUser(id){
    const p=S.pcs.find(x=>x.id===id); if(!p) return;
    openModal(`<h3>🔁 사용자 바꾸기</h3><p class="hint">‘${h(p.name)}’을(를) 이제 누가 쓰나요? 지금은 <b>${h(pname(p.personId)||"아무도 없음")}</b>이에요.</p>
      <div class="f"><label>새 사용자</label><select id="cuPid">${personOptions("", "(아무도 안 씀 → 남는 PC로)")}</select></div>
      <div class="f"><label>상태</label>${optButtons("cuSt",Object.keys(PC_ST),"사용중")}</div>
      <div class="f"><label>바꾼 날짜</label><input type="date" id="cuDate" value="${today()}"></div>
      <div class="f"><label>과제 <em>(선택)</em></label><input id="cuProj" value="${h(p.project||"")}" placeholder="예) A사 PLL 과제"></div>
      <div class="f"><label>메모 <em>(선택)</em></label><input id="cuMemo" placeholder="예) 김OO 외부 과제로 이동해서 인계"></div>
      <div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn" onclick="App._saveChange('${h(id)}')">바꾸기</button></div>`);
    $("cuPid").addEventListener("change",e=>{ const v=e.target.value?"사용중":"대기"; document.querySelectorAll('[data-opt="cuSt"] .opt').forEach(b=>{b.classList.toggle("on",b.dataset.v===v)}); $("cuSt").value=v; });
    $("cuPid").dispatchEvent(new Event("change"));
  },
  async _saveChange(id){
    const p=S.pcs.find(x=>x.id===id); if(!p) return;
    const np=val("cuPid")||null, st=val("cuSt")||(np?"사용중":"대기");
    const hist=(p.history||[]).concat([{date:val("cuDate")||today(),from:pname(p.personId)||"",to:pname(np)||"",status:st,memo:val("cuMemo"),by:pname(S.myPid)||""}]).slice(-60);
    const body=Object.assign({},stripId(p),{personId:np,status:st,project:val("cuProj"),history:hist,updated:today()});
    if(await write(db=>db.doc("pcs/"+id).set(body),"사용자를 바꿨어요")) closeModal();
  },
  editPc(id){
    const p=id?S.pcs.find(x=>x.id===id):{status:"대기",inDate:today()};
    if(!p) return;
    openModal(`<h3>${id?"✏️ PC 정보 고치기":"＋ PC 등록"}</h3><p class="hint">⚠️ IP·MAC 주소나 계정 정보는 넣지 마세요.</p>
      <div class="f"><label>PC 이름</label><input id="pcName" value="${h(p.name||"")}" placeholder="예) PC-07"></div>
      <div class="f"><label>상태</label>${optButtons("pcSt",Object.keys(PC_ST),p.status)}</div>
      ${id?"":`<div class="f"><label>사용자 <em>(선택)</em></label><select id="pcPid">${personOptions(p.personId)}</select></div>`}
      <div class="f"><label>과제 <em>(선택)</em></label><input id="pcProj" value="${h(p.project||"")}" placeholder="예) A사 PLL 과제"></div>
      <div class="f"><label>위치 <em>(선택)</em></label><input id="pcPlace" value="${h(p.place||"")}" placeholder="예) 7층 A구역"></div>
      <div class="f"><label>모델 <em>(선택)</em></label><input id="pcModel" value="${h(p.model||"")}" placeholder="예) 데스크톱 i7 / 노트북"></div>
      <div class="f"><label>반입일 <em>(선택)</em></label><input type="date" id="pcIn" value="${h(p.inDate||"")}"></div>
      <div class="f"><label>메모 <em>(선택)</em></label><textarea id="pcNote">${h(p.note||"")}</textarea></div>
      <div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn" onclick="App._savePc('${id?h(id):""}')">저장</button></div>`);
  },
  async _savePc(id){
    const name=val("pcName"); if(!name){ toast("PC 이름을 써 주세요"); return; }
    const old=id?S.pcs.find(x=>x.id===id):null;
    const body=Object.assign({},old?stripId(old):{history:[]},{name,status:val("pcSt")||"대기",project:val("pcProj"),place:val("pcPlace"),model:val("pcModel"),inDate:val("pcIn"),note:val("pcNote"),updated:today()});
    if(!id){ body.personId=val("pcPid")||null; if(body.personId) body.history=[{date:today(),from:"",to:pname(body.personId),status:body.status,memo:"처음 등록",by:pname(S.myPid)||""}]; }
    const nid=id||uidGen();
    if(await write(db=>db.doc("pcs/"+nid).set(body),id?"고쳤어요":"PC를 등록했어요")) closeModal();
  },
  delPc(id){ const p=S.pcs.find(x=>x.id===id); openModal(`<h3>정말 지울까요?</h3><p class="hint">‘${h(p.name)}’과(와) 바뀐 기록이 모두 지워져요. 테라타워에서 아예 빠진 PC만 지우세요.</p><div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn danger" onclick="App._delPc('${h(id)}')">지우기</button></div>`); },
  async _delPc(id){ if(await write(db=>db.doc("pcs/"+id).delete(),"지웠어요")) closeModal(); },

  /* 좌석 */
  seatDetail(id){
    const s=S.seats.find(x=>x.id===id); if(!s) return;
    openModal(`<h3>🪑 ${h(s.zone||"")} ${h(s.num)}번 자리</h3><p class="hint">지금: <b>${h(pname(s.personId)||"빈자리")}</b></p>
      <div class="f"><label>이 자리에 앉을 사람</label><select id="stPid">${personOptions(s.personId,"(빈자리로 두기)")}</select></div>
      <div class="f"><label>메모 <em>(선택)</em></label><input id="stNote" value="${h(s.note||"")}" placeholder="예) 모니터 2대"></div>
      <p class="muted" style="font-size:15px">이 사람이 다른 자리에 있었다면 그 자리는 자동으로 비워져요.</p>
      <div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn" onclick="App._saveSeat('${h(id)}')">저장</button></div>
      ${isAdmin()?`<div class="actions" style="margin-top:8px"><button class="btn danger" onclick="App._delSeat('${h(id)}')">이 자리 없애기</button></div>`:""}`);
  },
  async _saveSeat(id){
    const s=S.seats.find(x=>x.id===id); const pid=val("stPid")||null;
    const ok=await write(async db=>{
      if(pid){ for(const o of S.seats.filter(x=>x.personId===pid&&x.id!==id)){ await db.doc("seats/"+o.id).set(Object.assign({},stripId(o),{personId:null})); } }
      await db.doc("seats/"+id).set(Object.assign({},stripId(s),{personId:pid,note:val("stNote"),updated:today()}));
    },pid?`${pname(pid)}님 자리로 정했어요`:"빈자리로 바꿨어요");
    if(ok) closeModal();
  },
  async _delSeat(id){ if(await write(db=>db.doc("seats/"+id).delete(),"자리를 없앴어요")) closeModal(); },
  addSeats(){
    openModal(`<h3>＋ 좌석 만들기</h3><p class="hint">구역 이름과 번호 범위를 쓰면 한 번에 만들어져요. 예) ‘7층 A구역’, 1번 ~ 12번</p>
      <div class="f"><label>구역 이름</label><input id="szZone" placeholder="예) 7층 A구역"></div>
      <div class="row"><div class="f" style="flex:1"><label>시작 번호</label><input type="number" id="szFrom" value="1" min="1"></div><div class="f" style="flex:1"><label>끝 번호</label><input type="number" id="szTo" value="10" min="1"></div></div>
      <div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn" onclick="App._mkSeats()">만들기</button></div>`);
  },
  async _mkSeats(){
    const z=val("szZone"), a=parseInt(val("szFrom"),10), b=parseInt(val("szTo"),10);
    if(!z){ toast("구역 이름을 써 주세요"); return; }
    if(!(a>0&&b>=a&&b-a<200)){ toast("번호 범위를 확인해 주세요 (최대 200석)"); return; }
    const exist=new Set(S.seats.filter(s=>s.zone===z).map(s=>String(s.num)));
    const ok=await write(async db=>{ for(let n=a;n<=b;n++){ if(exist.has(String(n))) continue; await db.doc("seats/"+uidGen()).set({zone:z,num:n,personId:null,note:""}); } },`좌석을 만들었어요`);
    if(ok) closeModal();
  },

  /* 사람 */
  personDetail(id){
    const p=person(id); if(!p) return;
    const st=P_ST[p.status]||{c:"b-gray"}, n=dday(p.contractEnd);
    const pcs=S.pcs.filter(x=>x.personId===id), seat=S.seats.find(s=>s.personId===id);
    const secs=gSections(), all=secs.reduce((k,s)=>k+(s.steps||[]).length,0), dn=S.progress[id]||{}, fin=secs.reduce((k,s)=>k+(s.steps||[]).filter(x=>dn[x.id]).length,0);
    const needClean=p.status!=="테라타워 근무"&&(pcs.some(x=>x.status==="사용중")||seat);
    openModal(`<div class="row"><h3 style="flex:1">👤 ${h(p.name)}</h3><span class="badge ${st.c}">${h(p.status||"-")}</span></div>
      ${needClean?`<div class="alert warn" style="margin:12px 0"><span class="ic">🧹</span><div style="flex:1"><b>PC·좌석 정리가 필요해요</b>테라타워에 없는데 아직 이 사람 것으로 되어 있어요.<div style="margin-top:8px"><button class="btn sm" onclick="App.cleanUp('${h(id)}')">한 번에 비우기</button></div></div></div>`:""}
      <dl class="kv" style="margin:14px 0">
        <dt>과제</dt><dd>${h(p.project||"-")}</dd>
        <dt>계약 기간</dt><dd>${fmtDate(p.contractStart)} ~ ${fmtDate(p.contractEnd)} ${p.contractEnd?`<span class="badge ${n!=null&&n<0?"b-red":n!=null&&n<=30?"b-orange":"b-gray"}">${ddayText(n)}</span>`:""}</dd>
        <dt>PC</dt><dd>${pcs.length?pcs.map(x=>h(x.name)).join(", "):"-"}</dd>
        <dt>좌석</dt><dd>${seat?h((seat.zone||"")+" "+seat.num+"번"):"-"}</dd>
        <dt>입주가이드</dt><dd>${all?`${fin} / ${all} 완료`:"-"}</dd>
        <dt>연락처</dt><dd>${h(p.contact||"-")}</dd>
        <dt>메모</dt><dd style="white-space:pre-wrap">${h(p.note||"-")}</dd>
      </dl>
      <div class="actions"><button class="btn" onclick="App.editPerson('${h(id)}')">✏️ 정보 고치기</button>${isAdmin()?`<button class="btn danger" onclick="App.delPerson('${h(id)}')">삭제</button>`:""}</div>
      <div class="actions" style="margin-top:8px"><button class="btn ghost" onclick="App.close()">닫기</button></div>`);
  },
  editPerson(id){
    const p=id?person(id):{status:"테라타워 근무"}; if(!p) return;
    openModal(`<h3>${id?"✏️ 정보 고치기":"＋ 사람 추가"}</h3><p class="hint">이름과 상태만 써도 저장돼요.</p>
      <div class="f"><label>이름</label><input id="ppName" value="${h(p.name||"")}" placeholder="예) 홍길동"></div>
      <div class="f"><label>지금 어디서 일하나요?</label>${optButtons("ppSt",Object.keys(P_ST),p.status)}</div>
      <div class="f"><label>과제 <em>(선택)</em></label><input id="ppProj" value="${h(p.project||"")}" placeholder="예) A사 PLL 과제"></div>
      <div class="row"><div class="f" style="flex:1;min-width:140px"><label>계약 시작</label><input type="date" id="ppS" value="${h(p.contractStart||"")}"></div><div class="f" style="flex:1;min-width:140px"><label>계약 종료</label><input type="date" id="ppE" value="${h(p.contractEnd||"")}"></div></div>
      <div class="f"><label>연락처 <em>(선택)</em></label><input id="ppC" value="${h(p.contact||"")}" placeholder="예) 010-0000-0000"></div>
      <div class="f"><label>메모 <em>(선택)</em></label><textarea id="ppNote">${h(p.note||"")}</textarea></div>
      <div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn" onclick="App._savePerson('${id?h(id):""}')">저장</button></div>`);
  },
  async _savePerson(id){
    const name=val("ppName"); if(!name){ toast("이름을 써 주세요"); return; }
    const old=id?person(id):null, st=val("ppSt")||"테라타워 근무";
    const body=Object.assign({},old?stripId(old):{},{name,status:st,project:val("ppProj"),contractStart:val("ppS"),contractEnd:val("ppE"),contact:val("ppC"),note:val("ppNote"),updated:today()});
    const nid=id||uidGen();
    if(await write(db=>db.doc("people/"+nid).set(body),id?"고쳤어요":"추가했어요")){
      closeModal();
      if(old&&old.status==="테라타워 근무"&&st!=="테라타워 근무"&&(S.pcs.some(x=>x.personId===nid&&x.status==="사용중")||S.seats.some(s=>s.personId===nid))){
        setTimeout(()=>openModal(`<h3>🧹 PC·좌석도 비울까요?</h3><p class="hint">${h(name)}님이 ‘${h(st)}’(으)로 바뀌었어요. 테라타워에서 쓰던 PC는 <b>남는 PC</b>로, 좌석은 <b>빈자리</b>로 바꿀까요?</p><div class="actions"><button class="btn ghost" onclick="App.close()">나중에</button><button class="btn" onclick="App.cleanUp('${h(nid)}')">네, 비워 주세요</button></div>`),150);
      }
    }
  },
  async cleanUp(pid){
    const nm=pname(pid);
    const ok=await write(async db=>{
      for(const x of S.pcs.filter(x=>x.personId===pid&&x.status==="사용중")){
        const hist=(x.history||[]).concat([{date:today(),from:nm,to:"",status:"대기",memo:"자동 정리 (테라타워에서 나감)",by:pname(S.myPid)||""}]).slice(-60);
        await db.doc("pcs/"+x.id).set(Object.assign({},stripId(x),{personId:null,status:"대기",history:hist,updated:today()}));
      }
      for(const s of S.seats.filter(s=>s.personId===pid)) await db.doc("seats/"+s.id).set(Object.assign({},stripId(s),{personId:null}));
    },"PC와 좌석을 비웠어요");
    if(ok) closeModal();
  },
  delPerson(id){ const p=person(id); openModal(`<h3>정말 지울까요?</h3><p class="hint">‘${h(p.name)}’님 정보가 지워져요. 회사를 아예 떠난 경우에만 지우세요. (외부 과제는 상태만 바꾸면 돼요)</p><div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn danger" onclick="App._delPerson('${h(id)}')">지우기</button></div>`); },
  async _delPerson(id){
    const ok=await write(async db=>{
      for(const x of S.pcs.filter(x=>x.personId===id)) await db.doc("pcs/"+x.id).set(Object.assign({},stripId(x),{personId:null,status:x.status==="사용중"?"대기":x.status}));
      for(const s of S.seats.filter(s=>s.personId===id)) await db.doc("seats/"+s.id).set(Object.assign({},stripId(s),{personId:null}));
      await db.doc("people/"+id).delete();
    },"지웠어요");
    if(ok){ if(S.myPid===id) setMe(null); closeModal(); }
  },

  /* 로그인 · 관리자 */
  saveApi(){ const u=val("apiUrl"); if(!/^https:\/\/script\.google\.com\//.test(u)){ toast("구글 Apps Script 주소를 넣어 주세요"); return; } S.api=u; ls.set(LS_API,u); S.err=null; load(); },
  async login(){
    const pw=val("loginPw"); if(!pw){ toast("비밀번호를 넣어 주세요"); return; }
    S.pw=pw; S.err=null; S.connected=false; render();
    try{ await api({action:"ping"}); ls.set(LS_PW,pw); load(); }
    catch(e){ S.pw=""; S.err="login"; render(); toast(e.code==="auth"?"비밀번호가 맞지 않아요":"연결하지 못했어요. 인터넷을 확인해 주세요."); }
  },
  logout(){ S.pw=""; S.adminPw=""; S.adminOk=false; ls.set(LS_PW,""); ls.set(LS_ADMIN,""); S.connected=false; S.err="login"; render(); },
  async adminOn(){
    const pw=val("adPw"); if(!pw){ toast("관리자 비밀번호를 넣어 주세요"); return; }
    S.adminPw=pw;
    try{ const j=await api({action:"ping"}); if(j.admin){ S.adminOk=true; ls.set(LS_ADMIN,pw); toast("관리자 모드를 켰어요"); } else { S.adminPw=""; toast("관리자 비밀번호가 맞지 않아요"); } }
    catch(e){ S.adminPw=""; toast("연결하지 못했어요"); }
    render();
  },
  adminOff(){ S.adminPw=""; S.adminOk=false; S.guideEdit=false; ls.set(LS_ADMIN,""); render(); toast("관리자 모드를 껐어요"); },

  /* 백업 */
  async exportXlsx(){
    if(!window.XLSX){ toast("엑셀 도구를 불러오는 중이에요. 잠시 후 다시 눌러 주세요."); return; }
    const X=window.XLSX, wb=X.utils.book_new();
    const add=(name,rows)=>{ const ws=X.utils.json_to_sheet(rows.length?rows:[{"(비어 있음)":""}]); X.utils.book_append_sheet(wb,ws,name); };
    add("사람",S.people.slice().sort(byName).map(p=>({"이름":p.name,"상태":p.status,"과제":p.project||"","계약시작":p.contractStart||"","계약종료":p.contractEnd||"","연락처":p.contact||"","메모":p.note||""})));
    add("PC",S.pcs.slice().sort((a,b)=>natural(a.name||"",b.name||"")).map(p=>({"PC이름":p.name,"상태":p.status,"사용자":pname(p.personId),"과제":p.project||"","위치":p.place||"","모델":p.model||"","반입일":p.inDate||"","메모":p.note||""})));
    const hist=[]; S.pcs.forEach(p=>(p.history||[]).forEach(x=>hist.push({"PC이름":p.name,"날짜":x.date,"이전 사용자":x.from,"새 사용자":x.to,"상태":x.status||"","메모":x.memo||"","기록한 사람":x.by||""})));
    hist.sort((a,b)=>(a["날짜"]||"").localeCompare(b["날짜"]||"")); add("PC변경기록",hist);
    add("좌석",S.seats.slice().sort((a,b)=>natural((a.zone||"")+a.num,(b.zone||"")+b.num)).map(s=>({"구역":s.zone,"번호":s.num,"사용자":pname(s.personId),"메모":s.note||""})));
    const g=[]; gSections().forEach((s,i)=>(s.steps||[]).forEach((st,k)=>g.push({"단계":`${i+1}. ${s.title}`,"순서":k+1,"할 일":st.title,"설명":st.desc||"","담당·문의":st.who||""}))); add("입주가이드",g);
    try{ X.writeFile(wb,`나노디자인_백업_${today()}.xlsx`); toast("엑셀 파일을 받았어요"); }
    catch(e){ toast("파일을 받지 못했어요"); }
  }
};
function stripId(o){ const c=Object.assign({},o); delete c.id; return c; }
function focusSearch(){ const el=document.querySelector(".search"); if(el){ el.focus(); const v=el.value; el.setSelectionRange(v.length,v.length); } }
window.App=App;

route();
start();
})();
</script>
</body>
</html>
