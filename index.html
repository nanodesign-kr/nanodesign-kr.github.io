<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나노디자인</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f3f5f9" id="themeColor">
<script>try{var t=localStorage.getItem("nd_theme");if(t==="dimgray")t="gray";if(/^(dark|gray|pink|green|brown)$/.test(t||""))document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나노디자인">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#1b2333; --sub:#5b6577; --line:#e3e7ef;
  --pri:#2563eb; --pri-soft:#e8f0ff;
  --green:#15803d; --green-soft:#e6f6ec;
  --orange:#c2410c; --orange-soft:#fff1e6;
  --gray:#64748b; --gray-soft:#eef1f5;
  --red:#b91c1c; --red-soft:#fdecec;
  --purple:#7c3aed; --purple-soft:#f1eafe;
  --card2:#fafbfd; --line2:#cdd4e0; --hdr:rgba(243,245,249,.94);
  --seat-used-b:#bcd0fb; --seat-used-c:#1e3a8a; --seat-free-b:#cfe9d7;
  --r:16px; color-scheme:light;
}
:root[data-theme="gray"]{
  --bg:#5b6069; --card:#6b7079; --card2:#747a83; --ink:#ffffff; --sub:#e3e6ea; --line:#80868f; --line2:#959ba4; --hdr:rgba(91,96,105,.95);
  --pri:#b9ceff; --pri-soft:#55607a;
  --green:#a6f0c3; --green-soft:#4f6a5c;
  --orange:#ffd0a6; --orange-soft:#6e6052;
  --gray:#e3e6ea; --gray-soft:#646a73;
  --red:#ffc0c0; --red-soft:#735a5d;
  --purple:#dccbff; --purple-soft:#625c78;
  --seat-used-b:#a9bfff; --seat-used-c:#ffffff; --seat-free-b:#9ad7b3;
  color-scheme:dark;
}
:root[data-theme="pink"]{
  --bg:#fcedf3; --card:#fffafc; --card2:#fdf3f7; --ink:#3d2531; --sub:#80606f; --line:#f2d5e1; --line2:#e7bdcf; --hdr:rgba(252,237,243,.95);
  --pri:#d24f86; --pri-soft:#fbdeea;
  --gray-soft:#f6e6ed; --purple:#9a4fc4; --purple-soft:#f1e3fa;
  --seat-used-b:#efb3cc; --seat-used-c:#8f2457; --seat-free-b:#bfe3cc;
}
:root[data-theme="green"]{
  --bg:#eaf6ee; --card:#fbfefc; --card2:#f1f9f4; --ink:#1e3428; --sub:#557265; --line:#cfe8d8; --line2:#b2d9c0; --hdr:rgba(234,246,238,.95);
  --pri:#2b9765; --pri-soft:#d7f0e2;
  --gray-soft:#e2efe7;
  --seat-used-b:#9fd6b9; --seat-used-c:#17583a; --seat-free-b:#cde6d6;
}
:root[data-theme="brown"]{
  --bg:#f2ebe0; --card:#fbf7f0; --card2:#f6efe4; --ink:#3d2e22; --sub:#7d6957; --line:#e2d4c1; --line2:#cfbca3; --hdr:rgba(242,235,224,.95);
  --pri:#946541; --pri-soft:#eee0cd;
  --green:#5f7d4b; --green-soft:#e5eadb;
  --orange:#b5713a; --orange-soft:#f4e3cd;
  --gray:#7d6957; --gray-soft:#ebe1d3;
  --red:#a4473b; --red-soft:#f2ddd6;
  --purple:#7c5b78; --purple-soft:#eee2ea;
  --seat-used-b:#d2b28f; --seat-used-c:#6b4528; --seat-free-b:#c9d3b6;
}
/* 브라운: 오래된 종이 같은 은은한 결 + 제목은 명조체로 엔틱하게 */
:root[data-theme="brown"] body{background:radial-gradient(ellipse at top,#f7f1e7 0%,#f2ebe0 55%,#ebe1d3 100%) fixed}
:root[data-theme="brown"] .alert.info{border-color:var(--line2)}
:root[data-theme="brown"] .card,:root[data-theme="brown"] .item,:root[data-theme="brown"] .gsec,:root[data-theme="brown"] .grp,:root[data-theme="brown"] .stat{box-shadow:0 1px 0 rgba(120,90,60,.08)}
:root[data-theme="dark"]{
  --bg:#0e131c; --card:#171e2b; --card2:#1d2535; --ink:#e6ebf4; --sub:#97a3b6; --line:#2a3446; --line2:#3a465c; --hdr:rgba(14,19,28,.94);
  --pri:#6b9bff; --pri-soft:#1c2a47;
  --green:#4ade80; --green-soft:#12301f;
  --orange:#fb923c; --orange-soft:#3a2415;
  --gray:#a3aec0; --gray-soft:#232c3c;
  --red:#f87171; --red-soft:#3b1a1d;
  --purple:#b394ff; --purple-soft:#2a2045;
  --seat-used-b:#34508f; --seat-used-c:#c7d7ff; --seat-free-b:#24573a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 100px}
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;min-height:56px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.brand{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.brand img{display:block;height:26px;width:auto}
.ttl{font-weight:800;font-size:16px;line-height:1.2;text-align:center;white-space:nowrap;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.ttl small{display:block;font-weight:500;font-size:11px;color:var(--sub)}
.who{justify-self:end;font-size:13px;color:var(--sub);text-align:right}
.who b{color:var(--ink)}
.who{white-space:nowrap;display:flex;align-items:center;gap:6px}
.themesel{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:12px;font-weight:700;padding:0 2px;max-width:82px;width:82px}
@media(max-width:350px){.themesel{max-width:72px;width:72px;font-size:11px}}
@media(max-width:560px){.whoname{display:none}}
.themebtn{position:relative;width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;flex:none;cursor:pointer;overflow:hidden}
.themebtn .themesel{position:absolute;inset:0;width:100%;height:100%;max-width:none;opacity:0;cursor:pointer;border:0;margin:0}
.gear{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-decoration:none;font-size:18px;flex:none}
.gear.on{border-color:var(--pri);background:var(--pri-soft)}
.whoname{text-align:right}
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
.grp-h b{flex:1;font-size:15px}
.grp .item{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.grp .item:last-child{border-bottom:0}
.grp-h.pj{padding:0}
.pjt{flex:1;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);text-align:left;padding:13px 12px;min-width:0;cursor:pointer}
.pjt .pjn{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pjt .pjn b{font-size:15px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.pjt .pjb{display:flex;gap:5px;flex-wrap:wrap}
:root[data-theme="dark"] .btn:not(.ghost):not(.soft):not(.danger),:root[data-theme="gray"] .btn:not(.ghost):not(.soft):not(.danger){color:#0e131c}
.caret{width:14px;color:var(--sub);flex:none}
.pje{flex:none;border:0;border-left:1px solid var(--line);background:transparent;padding:0 14px;align-self:stretch;font-size:15px;cursor:pointer}
.pjinfo{font-size:12px;padding:8px 14px 0}
.pjbar{padding:8px 14px 10px}
.ctb{font-size:12px}
.ctb-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;color:var(--sub);margin-bottom:5px;flex-wrap:wrap}
.ctb-l{font-weight:800;white-space:nowrap}
.ctb-l.green{color:var(--green)}.ctb-l.orange{color:var(--orange)}.ctb-l.red,.ctb-l.over{color:var(--red)}
.ctb-track{height:10px;border-radius:99px;background:var(--gray-soft);overflow:hidden;flex:1}
.ctb-track i{display:block;height:100%;border-radius:99px;background:#22c55e}
.ctb-hint{font-size:11px;color:var(--sub);margin-top:4px}
.ctb.sm{display:flex;align-items:center;gap:8px;margin-top:6px}
.ctb.sm .ctb-track{height:7px}
.ctb.sm .ctb-l{font-size:11px}
.sortsel{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:12px;font-weight:700;padding:0 6px}
[data-lp]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[data-lp].pressing{background:var(--pri-soft)}
.brand img{height:28px!important}
@media(max-width:340px){.brand img{height:24px!important}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;color:var(--sub);font-size:11px;font-weight:700;white-space:nowrap;word-break:keep-all;letter-spacing:-.4px;min-width:0;overflow:hidden}
nav.tabs a span.t{display:block;white-space:nowrap}
nav.tabs a .ic{font-size:18px;line-height:1}
nav.tabs a.on{color:var(--pri)}
nav.tabs a.on .ic{transform:scale(1.08)}
h1.page{font-size:20px;font-weight:800;margin:20px 0 4px}
p.lead{margin:0 0 18px;color:var(--sub)}
h2.sec{font-size:16px;font-weight:800;margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:639px){.g4{grid-template-columns:repeat(2,1fr)}}
.stat{display:block;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;text-decoration:none;color:inherit}
.stat .k{font-size:13px;color:var(--sub);font-weight:700}
.stat .v{font-size:26px;font-weight:800;line-height:1.15;margin-top:4px}
.stat .s{font-size:12px;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;min-height:44px;background:var(--pri);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.big{width:100%;font-size:15px;min-height:50px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)}
.b-blue{background:var(--pri-soft);color:var(--pri)}
.b-orange{background:var(--orange-soft);color:var(--orange)}
.b-gray{background:var(--gray-soft);color:var(--gray)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-purple{background:var(--purple-soft);color:var(--purple)}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%;text-align:left}
.item .main{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15px}
.item .meta{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.item .arrow{color:#9aa3b2;font-size:20px}
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px 16px;border:1px solid}
.alert .ic{font-size:18px;line-height:1.3}
.alert.warn{background:var(--orange-soft);border-color:rgba(234,88,12,.3)}
.alert.info{background:var(--pri-soft);border-color:rgba(37,99,235,.3)}
.alert.ok{background:var(--green-soft);border-color:rgba(21,128,61,.3)}
.alert.err{background:var(--red-soft);border-color:rgba(185,28,28,.3)}
.alert b{display:block}
.empty{text-align:center;color:var(--sub);padding:28px 12px;border:2px dashed var(--line);border-radius:var(--r);background:var(--card)}
.empty .ic{font-size:33px}
/* guide */
.gsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.gsec>summary{list-style:none;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.gsec>summary::-webkit-details-marker{display:none}
.gnum{width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.gnum.done{background:var(--green)}
.gsec .gt{font-weight:800;font-size:15px;flex:1}
.gsec .gp{font-size:12px;color:var(--sub);font-weight:700}
.gbody{border-top:1px solid var(--line);padding:6px 16px 16px}
.gdesc{background:var(--gray-soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub);margin:10px 0}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step.info .infoic{width:28px;flex:none;text-align:center;font-size:16px;margin-top:2px}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);background:var(--card);flex:none;display:grid;place-items:center;font-size:17px;color:#fff;margin-top:1px}
.chk.on{background:var(--green);border-color:var(--green)}
.step .st{font-weight:700}
.step.on .st{color:var(--sub);text-decoration:line-through}
.step .sd{font-size:13px;color:var(--sub);white-space:pre-wrap}
.step .sw{font-size:12px;color:var(--purple);font-weight:700;margin-top:2px}
.bar{height:12px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
/* seats */
.zone{margin-bottom:18px}
.zone h3{margin:0 0 10px;font-size:14px;font-weight:800}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.seat{border-radius:14px;padding:10px 8px;min-height:84px;text-align:center;border:2px solid;display:flex;flex-direction:column;justify-content:center;gap:2px}
.seat .sn{font-size:11px;font-weight:800;opacity:.8}
.seat .sp2{font-size:13px;font-weight:800;word-break:keep-all}
.seat.free{background:var(--card);border-color:var(--seat-free-b);border-style:dashed;color:var(--green)}
.seat.used{background:var(--pri-soft);border-color:var(--seat-used-b);color:var(--seat-used-c)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:640px){.sheet{border-radius:22px}}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:800}
.sheet .hint{color:var(--sub);font-size:13px;margin:0 0 14px}
.f{margin-bottom:14px}
.f label{display:block;font-weight:700;margin-bottom:6px}
.f label em{font-style:normal;color:var(--sub);font-weight:500;font-size:13px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:12px;background:var(--card);font-size:16px}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:3px solid #bfd3ff;border-color:var(--pri)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:2px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-weight:700;background:var(--card)}
.opt.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.kv{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--sub);font-weight:700}
.kv dd{margin:0;font-weight:500;word-break:break-all}
.hist{border-left:3px solid var(--line);padding-left:14px;margin-left:6px}
.hist div{padding:6px 0;font-size:13px}
.hist small{color:var(--sub);display:block}
.erow{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--card2)}
.erow .row input{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2333;color:#fff;padding:10px 16px;font-size:13px;border-radius:12px;font-weight:700;z-index:70;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.ro{background:#fff7e6;border-bottom:1px solid #f6dfae;color:#8a5a00;font-size:14px;padding:8px 16px;text-align:center}
.help li{margin-bottom:6px}
.muted{color:var(--sub)}
.theme-sw{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:16px 0 0}
.theme-sw button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--sub)}
.theme-sw button.on{background:var(--pri);color:#fff}
a.tel{color:var(--pri);font-weight:800;text-decoration:underline;white-space:nowrap}
a.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--pri);font-weight:700;text-decoration:underline;word-break:break-all;padding:2px 0}
.lnk-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0}
.lnk-note{font-size:11px;color:var(--orange);font-weight:700}
.copy{border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:11px;padding:2px 8px;color:var(--sub)}
.notice{background:var(--pri-soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink);margin:10px 0;white-space:pre-wrap}
/* seat map */
.vsw{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.vsw button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700;font-size:13px;color:var(--sub)}
.vsw button.on{background:var(--ink);color:var(--bg)}
.fmap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zbox{border:2px solid var(--line2);border-radius:14px;padding:10px;background:var(--card);min-height:120px}
.zbox h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:6px}
.zbox h4 .muted{font-size:12px;font-weight:500}
.zbox.empty-z{border-style:dashed;opacity:.6}
.mseats{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.ms{border-radius:9px;border:2px solid;min-height:46px;padding:3px 2px;font-size:10px;line-height:1.2;text-align:center;display:flex;flex-direction:column;justify-content:center;overflow:hidden}

.zbox.zov{display:block;text-align:left;min-height:84px;cursor:pointer;color:var(--ink)}
.zbox.zov.sel{border-color:var(--pri);background:var(--pri-soft)}
.zstat{font-size:13px;color:var(--sub)}.zstat b{font-size:20px;color:var(--ink)}
.zbar{height:6px;border-radius:9px;background:var(--gray-soft);overflow:hidden;margin-top:6px}.zbar i{display:block;height:100%;background:var(--pri)}
.zdet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px}
.zdet h3{margin:0 0 8px;font-size:14px}
.srow{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px}
.rlab{flex:none;width:22px;height:46px;display:grid;place-items:center;font-weight:800;color:var(--sub);background:var(--gray-soft);border-radius:8px;font-size:12px}
.rstrip{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.rstrip .ms{flex:none;width:48px}
.door{grid-column:1/-1;text-align:center;font-size:11px;color:var(--sub);border-top:2px dashed var(--line2);padding-top:4px}
/* photos */
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:8px 0}

.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{border:2px dashed var(--line2);background:var(--card);font-weight:700;color:var(--pri);font-size:13px}

.pchk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--card)}
.pchk input{width:20px;height:20px;flex:none}
.pchk small{color:var(--sub)}
.gsearch{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px;margin-top:12px;height:40px}
.gsearch span{font-size:14px;opacity:.7}
.gsearch input{flex:1;border:0;background:transparent;font-size:16px;height:38px;min-width:0;outline:none;color:var(--ink)}
.gres-box{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;padding:6px;max-height:60vh;overflow:auto}
.gres-n{font-size:12px;color:var(--sub);padding:4px 8px}
.gres-g{font-size:12px;font-weight:800;padding:8px 8px 4px;color:var(--ink)}

<body>
<header class="top"><div class="in">
  <div id="themeBox"></div>
  <a href="#home" class="brand" aria-label="나노디자인 홈"><img src="logo-nanodesign.png" alt="NANO DESIGN 나노디자인"></a>
  <div class="who" id="who"></div>
</div><div id="robar"></div></header>

<main class="wrap" id="view"></main>

<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- 기본 설정 ---------- */
const TABS=[
  {id:"home",ic:"🏠",t:"홈"},
  {id:"guide",ic:"📋",t:"입주가이드"},
  {id:"pcs",ic:"💻",t:"PC"},
  {id:"seats",ic:"🪑",t:"좌석"},
  {id:"projects",ic:"📁",t:"과제"},
  {id:"people",ic:"👥",t:"인원"}
];
const ROUTES=TABS.map(t=>t.id).concat(["manage"]);
const PC_ST={
  "사용중":{c:"b-blue",d:"누군가 쓰고 있어요"},
  "대기":{c:"b-green",d:"남는 PC (바로 쓸 수 있어요)"},
  "반출":{c:"b-orange",d:"테라타워 밖으로 나갔어요"},
  "점검":{c:"b-gray",d:"고장·수리·점검 중"}
};
const P_ST={
  "테라타워 근무":{c:"b-blue"},
  "외부 과제":{c:"b-orange"},
  "대기":{c:"b-gray"}
};
/* 구글 시트 서버 주소 (Apps Script 웹 앱 URL) */
const APP_VER="2026.11.14-4";
const API_URL="https://script.google.com/macros/s/AKfycbxokzOXuXIKK8JgQ-DIxe3tTZ_B5UC8_ba744RRRR54Sl6YNhk2eaxZl8J_byK4wQZ3wA/exec";
const S={
  view:"home", api:"", pw:"", adminPw:"", adminOk:false, busy:false,
  connected:false, slow:false, err:null,
  pcs:[], people:[], seats:[], projects:[], guide:null, progress:{}, myPid:null,
  pcFilter:"전체", pcQ:"", pQ:"", pFilter:"전체", guideEdit:false,
  openSecs:null, seatView:"map", seatFloor:null, seatZone:"", photoCache:{},
  writeSeq:0, lastSig:"", progDirty:false, progTimer:null
};
const LS_KEY="nd_me_pid", LS_PW="nd_pw", LS_ADMIN="nd_admin", LS_API="nd_api", LS_THEME="nd_theme";
const ls={get(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k);}catch(e){}}};

/* ---------- 도우미 ---------- */
const $=id=>document.getElementById(id);
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function dday(dateStr){
  if(!dateStr) return null;
  const t=new Date(today()+"T00:00:00"), e=new Date(dateStr+"T00:00:00");
  return Math.round((e-t)/86400000);
}
function ddayText(n){ if(n==null) return ""; if(n===0) return "오늘 종료"; return n>0?`D-${n}`:`${-n}일 지남`; }
function fmtDate(s){ if(!s) return "-"; const [y,m,d]=s.split("-"); return `${y}.${m}.${d}`; }
function uidGen(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const t=$("toast"); t.innerHTML=`<div class="toast">${h(msg)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML="",2600); }
const person=id=>S.people.find(p=>p.id===id);
const pname=id=>{const p=person(id);return p?p.name:"";};
const isAdmin=()=>S.adminOk;
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"","ko");
const natural=(a,b)=>String(a).localeCompare(String(b),"ko",{numeric:true});
const ZONES=["A","B","C","D"];
function seatFloor(s){ if(s.floor) return String(s.floor); const m=String(s.zone||"").match(/(\d+)\s*층/); return m?m[1]:""; }
function seatZone(s){ if(s.floor) return s.zone||""; const m=String(s.zone||"").match(/([A-Da-d])\s*(존|구역|zone)?/); return m?m[1].toUpperCase():""; }
const ROWS="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
function seatCode(s){ return s.row?`${s.row}${String(s.num).padStart(2,"0")}`:`${s.num}번`; }
function seatLabel(s){ if(!s) return ""; const f=seatFloor(s), z=seatZone(s); return (f||z)?`${f?f+"층 ":""}${z?z+"존 ":""}${seatCode(s)}`:`${s.zone||""} ${seatCode(s)}`.trim(); }
const seatSortKey=s=>(s.row||"")+String(s.num).padStart(3,"0");
function numOptions(sel,from){ let o=""; for(let i=from||1;i<=16;i++) o+=`<option value="${i}" ${String(i)===String(sel)?"selected":""}>${String(i).padStart(2,"0")}</option>`; return o; }
function rowOptions(sel){ return ROWS.map(r=>`<option value="${r}" ${r===sel?"selected":""}>${r}열</option>`).join(""); }
function projectNames(){ const set=new Set(); S.projects.forEach(p=>p.name&&set.add(p.name.trim())); S.people.forEach(p=>p.project&&set.add(p.project.trim())); S.pcs.forEach(p=>p.project&&set.add(p.project.trim())); return [...set].filter(Boolean).sort(natural); }
const projByName=n=>S.projects.find(p=>(p.name||"").trim()===(n||"").trim());
/* 과제명 콤보박스: 목록에서 고르거나 '새 과제명 직접 입력' */
function projSelect(id,cur,emptyLabel){
  const names=projectNames(); cur=(cur||"").trim();
  if(cur&&!names.includes(cur)) names.push(cur);
  return `<select id="${id}" onchange="App.projSel('${id}')"><option value="">${emptyLabel||"(과제 없음)"}</option>${names.map(n=>`<option value="${h(n)}" ${n===cur?"selected":""}>${h(n)}</option>`).join("")}<option value="__new">＋ 새 과제명 직접 입력</option></select><input id="${id}New" style="display:none;margin-top:8px" placeholder="새 과제명 (예: A사 PLL 과제)">`;
}
const IP_TYPES=["UCI","PMIC","DDI","RCD","RF","SerDes","PLL","ADC/DAC","Memory","Sensor"];
/* 목록에서 고르거나 직접 입력하는 콤보박스 (예: IP 종류) */
function comboSelect(id,cur,presets,emptyLabel){
  const set=[...presets]; S.projects.forEach(p=>{ if(p.ipType&&!set.includes(p.ipType)) set.push(p.ipType); });
  cur=(cur||"").trim(); if(cur&&!set.includes(cur)) set.push(cur);
  return `<select id="${id}" onchange="App.projSel('${id}')"><option value="">${emptyLabel||"(선택 안 함)"}</option>${set.map(n=>`<option value="${h(n)}" ${n===cur?"selected":""}>${h(n)}</option>`).join("")}<option value="__new">＋ 직접 입력</option></select><input id="${id}New" style="display:none;margin-top:8px" placeholder="IP 종류 직접 입력">`;
}
function projVal(id){ const v=val(id); return v==="__new"?val(id+"New"):v; }

/* ---------- 서버(구글 시트) ---------- */
async function api(body){
  const r=await fetch(S.api,{method:"POST",body:JSON.stringify(Object.assign({pw:S.pw,admin:S.adminPw||undefined},body)),redirect:"follow"});
  if(!r.ok) throw {code:"net"};
  const j=await r.json();
  if(!j.ok) throw {code:j.code||"err"};
  return j;
}
function applyData(d,admin){
  const arr=o=>Object.keys(o||{}).map(id=>Object.assign({},o[id],{id}));
  S.pcs=arr(d.pcs); S.people=arr(d.people); S.seats=arr(d.seats); S.projects=arr(d.projects);
  const keepMine=S.progDirty&&S.myPid?S.progress[S.myPid]:null;
  S.progress={}; Object.keys(d.progress||{}).forEach(id=>S.progress[id]=(d.progress[id].done)||{});
  if(keepMine) S.progress[S.myPid]=keepMine;
  S.guide=(d.guide||{}).main||null;
  S.adminOk=!!admin;
  if(!admin&&S.adminPw){ S.adminPw=""; ls.set(LS_ADMIN,""); }
  S.connected=true; S.slow=false; S.err=null;
}
function hasModalInput(){ const a=document.activeElement; return !!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
async function load(quiet){
  if(!S.api){ S.err="noapi"; render(); return; }
  if(!S.pw){ S.err="login"; render(); return; }
  if(S.busy) return;
  const timer=setTimeout(()=>{ if(!S.connected){ S.slow=true; render(); } },10000);
  const ws=S.writeSeq;
  try{
    const j=await api({action:"all"});
    if(S.writeSeq!==ws||S.busy) return;           /* 그사이 저장이 있었으면 옛날 데이터라 버려요 */
    const sig=JSON.stringify(j.data)+"|"+j.admin;
    const changed=sig!==S.lastSig; S.lastSig=sig;
    applyData(j.data,j.admin);
    if(quiet&&(!changed||hasModalInput())) return; /* 바뀐 게 없으면 화면을 다시 그리지 않아요 (스크롤 튐 방지) */
    render();
  }catch(e){
    if(e.code==="auth"){ S.pw=""; ls.set(LS_PW,""); S.err="login"; S.connected=false; render(); }
    else if(!S.connected){ S.err="sub"; render(); }
    console.warn(e);
  }finally{ clearTimeout(timer); }
}
/* 바꾸기: fn(db) 안에서 db.doc("모음/아이디").set(...) / .delete() 를 모아 한 번에 보내요 */
async function write(fn,okMsg,quiet){
  if(!S.connected){ toast("아직 연결되지 않았어요. 잠시 후 다시 해 주세요."); return false; }
  if(S.saving){ if(!quiet) toast("저장하는 중이에요. 잠시만 기다려 주세요."); return false; }
  const ops=[];
  const db={doc(path){ const i=path.indexOf("/"), col=path.slice(0,i), id=path.slice(i+1);
    return {set:async d=>{ops.push({op:"set",col,id,data:d});}, delete:async()=>{ops.push({op:"del",col,id});}}; }};
  try{
    await fn(db);
    if(!ops.length) return true;
    S.busy=true; S.saving=true; S.writeSeq++;
    document.querySelectorAll("#modal button").forEach(b=>b.disabled=true);
    const j=await api({action:"batch",ops});
    S.lastSig=JSON.stringify(j.data)+"|"+j.admin;
    applyData(j.data,j.admin);
    if(okMsg) toast(okMsg);
    render();
    return true;
  }catch(e){
    if(e&&e.code==="seatTaken") toast(`그 자리는 이미 ${e.who}님 자리예요. 다른 자리를 골라 주세요.`);
    else if(e&&e.code==="admin") toast("관리자만 할 수 있어요. 오른쪽 위 ⚙️에서 관리자 모드를 켜 주세요.");
    else if(e&&e.code==="auth"){ toast("비밀번호가 바뀌었어요. 다시 들어와 주세요."); S.pw=""; ls.set(LS_PW,""); S.err="login"; render(); }
    else toast("저장하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.");
    document.querySelectorAll("#modal button").forEach(b=>b.disabled=false);
    console.warn(e); S.busy=false; S.saving=false; load(true); return false;
  }finally{ S.busy=false; S.saving=false; }
}
function start(){
  S.api=API_URL||ls.get(LS_API); S.pw=ls.get(LS_PW); S.adminPw=ls.get(LS_ADMIN);
  applyTheme(ls.get(LS_THEME)||"light");
  S.projSort=ls.get("nd_projsort")||"asc";
  const v=ls.get(LS_KEY); if(v) S.myPid=v;
  load();
  setInterval(()=>{ if(document.visibilityState==="visible") load(true); },30000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") load(true); });
}
const THEMES=[["light","Light"],["gray","Gray"],["dark","Dark"],["pink","Pink"],["green","Green"],["brown","Brown"]];
function applyTheme(t){
  if(t==="dimgray") t="gray";
  t=THEMES.some(x=>x[0]===t)?t:"light";
  document.documentElement.setAttribute("data-theme",t);
  const m=$("themeColor"); if(m) m.setAttribute("content",{dark:"#0e131c",gray:"#5b6069",light:"#f3f5f9",pink:"#fcedf3",green:"#eaf6ee",brown:"#f2ebe0"}[t]);
}
/* 입주가이드 체크: 화면에 바로 반영하고, 서버 저장은 순서대로 한 번에 보내요 (체크가 풀리는 문제 방지) */
function queueProgress(){
  S.progDirty=true; clearTimeout(S.progTimer);
  S.progTimer=setTimeout(flushProgress,500);
}
async function flushProgress(){
  if(!S.progDirty||!S.myPid) return;
  if(S.saving){ S.progTimer=setTimeout(flushProgress,600); return; }
  const pid=S.myPid, cur=Object.assign({},S.progress[pid]||{});
  const sent=JSON.stringify(cur);
  const ok=await write(db=>db.doc("progress/"+pid).set({done:cur,updated:today()}),null,true);
  if(ok&&JSON.stringify(S.progress[pid]||{})===sent){ S.progDirty=false; }
  else { S.progTimer=setTimeout(flushProgress,ok?50:3000); }
}
function setMe(pid){
  S.myPid=pid||null; ls.set(LS_KEY,pid||"");
  render(); toast(pid?`'${pname(pid)}'(으)로 설정했어요`:"선택을 해제했어요");
}

/* ---------- 화면 공통 ---------- */
function renderTop(){
  const me=S.myPid&&person(S.myPid);
  const th=document.documentElement.getAttribute("data-theme")||"light";
  $("themeBox").innerHTML=`<label class="themebtn" title="Color theme"><span aria-hidden="true">🎨</span><select class="themesel" aria-label="Color theme" onchange="App.setTheme(this.value)">${THEMES.map(([v,l])=>`<option value="${v}" ${th===v?"selected":""}>${l}</option>`).join("")}</select></label>`;
  $("who").innerHTML=`<span class="whoname">${me?`<b>${h(me.name)}</b>님`:""}${isAdmin()?'<span class="tag-admin">관리자</span>':""}</span><a href="#manage" class="gear ${S.view==="manage"?"on":""}" aria-label="관리">⚙️</a>`;
  $("robar").innerHTML="";
  $("tabs").innerHTML=TABS.map(t=>`<a href="#${t.id}" class="${S.view===t.id?"on":""}"><span class="ic">${t.ic}</span><span class="t">${t.t}</span></a>`).join("");
}
function render(){
  renderTop();
  const v=$("view");
  if(S.err==="noapi"){ v.innerHTML=`<h1 class="page">서버 연결 설정</h1><p class="lead">구글 시트 웹 앱 주소(…/exec)를 넣어 주세요. 한 번만 하면 돼요.</p><div class="f"><input id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec"></div><button class="btn big" onclick="App.saveApi()">저장</button>`; $("tabs").innerHTML=""; return; }

function route(){

/* 화면을 옆으로 쓸면 옆 탭으로: 오른쪽→왼쪽으로 쓸면 오른쪽 탭, 왼쪽→오른쪽이면 왼쪽 탭 */
(function(){
  let sx=0, sy=0, st=0, ok=false;
  document.addEventListener("touchstart",e=>{
    ok=false; if(e.touches.length!==1) return;
    const t=e.touches[0], el=e.target;
    if($("modal").innerHTML) return;                                   /* 창이 열려 있으면 안 함 */
    if(!$("view").contains(el)) return;                                 /* 위·아래 메뉴는 제외 */
    if(el.closest("input,textarea,select,.rstrip,.mseats,[data-noswipe]")) return; /* 입력칸·좌석 줄(옆 스크롤)은 제외 */
    if(t.clientX<24||t.clientX>window.innerWidth-24) return;            /* 화면 가장자리(뒤로가기 제스처)는 제외 */
    sx=t.clientX; sy=t.clientY; st=Date.now(); ok=true;
  },{passive:true});
  document.addEventListener("touchend",e=>{
    if(!ok) return; ok=false;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8||dt>700) return;
    const i=TABS.findIndex(x=>x.id===S.view); if(i<0) return;
    const j=dx<0?i+1:i-1; if(j<0||j>=TABS.length) return;
    location.hash="#"+TABS[j].id;
  },{passive:true});
})();
window.addEventListener("hashchange",route);

/* ---------- 전체 검색 ---------- */
function normQ(t){ return String(t||"").toLowerCase().replace(/\s+/g," ").trim(); }
function hit(text,q,qd){
  const t=String(text||""); if(!t) return false;
  if(t.toLowerCase().includes(q)) return true;
  if(qd&&qd.length>=3&&t.replace(/\D/g,"").includes(qd)) return true;   /* 전화번호·IP는 숫자만으로도 찾아요 */
  return false;
}
function mark(text,q){
  const t=String(text||""), i=t.toLowerCase().indexOf(q);
  if(i<0) return h(t);
  return h(t.slice(0,i))+"<mark>"+h(t.slice(i,i+q.length))+"</mark>"+h(t.slice(i+q.length));
}
function snippet(text,q){
  const t=String(text||"").replace(/\s+/g," "), i=t.toLowerCase().indexOf(q);
  if(i<0) return h(t.slice(0,60));
  const a=Math.max(0,i-18), b=Math.min(t.length,i+q.length+30);
  return (a?"…":"")+mark(t.slice(a,b),q)+(b<t.length?"…":"");
}
function searchHtml(raw){
  const q=normQ(raw); if(q.length<1) return "";
  const qd=/^[\d\s\-.]+$/.test(q)?q.replace(/\D/g,""):"";
  const R=[];
  S.people.forEach(p=>{
    const f=[p.name,p.nameEn,p.rank,p.status,p.project,p.contact,p.email,p.knox,p.ssoId,p.vwpId,p.note];
    if(f.some(x=>hit(x,q,qd))){ const which=f.find(x=>hit(x,q,qd)); R.push({g:"👤 사람",t:mark(p.name,q),s:which!==p.name?snippet(which,q):h(p.project||p.status||""),on:`App.personDetail('${h(p.id)}')`}); }
  });
  S.pcs.forEach(p=>{
    const f=[p.name,p.model,p.mfgNo,p.serial,p.mac,p.ip,pname(p.personId),p.note];
    if(f.some(x=>hit(x,q,qd))){ const which=f.find(x=>hit(x,q,qd)); R.push({g:"💻 PC",t:mark(p.name,q),s:which!==p.name?snippet(which,q):h(pname(p.personId)||""),on:`App.pcDetail('${h(p.id)}')`}); }
  });
  projectNames().forEach(n=>{
    const pj=projByName(n)||{}, f=[n,pj.ipType,pj.process,pj.client,pj.place,pj.note];
    if(f.some(x=>hit(x,q,qd))){ const which=f.find(x=>hit(x,q,qd)); R.push({g:"📁 과제",t:mark(n,q),s:which!==n?snippet(which,q):`${S.people.filter(p=>(p.project||"").trim()===n).length}명`,on:`App.goProject(this.dataset.n)`,data:n}); }
  });
  S.seats.forEach(st=>{
    const lab=seatLabel(st), who=pname(st.personId);
    if(hit(lab,q,qd)||hit(seatCode(st),q,qd)||hit(st.note,q,qd)) R.push({g:"🪑 좌석",t:mark(lab,q),s:h(who||"빈자리"),on:`App.seatDetail('${h(st.id)}')`});
  });
  gSections().forEach((sec,i)=>{
    (sec.steps||[]).forEach(st=>{
      const f=[st.title,st.desc,st.who];
      if(f.some(x=>hit(x,q,qd))){ const which=f.find(x=>hit(x,q,qd)); R.push({g:"📋 입주가이드",t:mark(st.title,q),s:`<span class="muted">${h(sec.title)}</span>${which!==st.title?" · "+snippet(which,q):""}`,on:`App.goStep('${h(sec.id||i)}','${h(st.id)}')`}); }
    });
    if(hit(sec.title,q,qd)||hit(sec.desc,q,qd)) R.push({g:"📋 입주가이드",t:mark(sec.title,q),s:sec.desc?snippet(sec.desc,q):"",on:`App.goStep('${h(sec.id||i)}','')`});
  });
  if(!R.length) return `<div class="gres-empty">‘${h(raw.trim())}’ 검색 결과가 없어요.</div>`;
  const groups={}; R.forEach(r=>(groups[r.g]=groups[r.g]||[]).push(r));
  return `<div class="gres-box"><div class="gres-n">검색 결과 ${R.length}개</div>`+Object.keys(groups).map(g=>`<div class="gres-g">${g} <span class="muted">${groups[g].length}</span></div>`+groups[g].slice(0,8).map(r=>`<button class="gres-i" ${r.data!=null?`data-n="${h(r.data)}"`:""} onclick="${r.on}"><b>${r.t}</b>${r.s?`<span>${r.s}</span>`:""}</button>`).join("")+(groups[g].length>8?`<div class="muted" style="font-size:12px;padding:4px 10px">… 외 ${groups[g].length-8}개 (검색어를 더 자세히 써 보세요)</div>`:"")).join("")+`</div>`;
}

/* info:true 인 항목은 체크박스 없이 안내만 보여 주고, 진행률 계산에서도 빠져요 */
const tasksOf=s=>(s.steps||[]).filter(x=>!x.info);
function gSections(){ return (S.guide&&Array.isArray(S.guide.sections))?S.guide.sections:[]; }
function vGuide(){
  const secs=gSections(), done=(S.myPid&&S.progress[S.myPid])||{};
  const all=secs.reduce((n,s)=>n+tasksOf(s).length,0);

  let o=`<h1 class="page">📋 입주가이드</h1><p class="lead">테라타워에 처음 오면 위에서부터 차례대로 하면 돼요. 끝낸 일은 네모를 눌러 ✔ 표시하세요. 🔗 링크를 누르면 사이트가 바로 열려요. <b>사내망 전용</b> 주소는 회사 PC에서만 열리니, 휴대폰에서는 ‘복사’해서 PC로 보내 쓰세요.</p>`;
  o+=`<div class="row" style="margin-bottom:14px"><button class="btn sm ${S.guideEdit?"":"ghost"}" onclick="App.toggleGuideEdit()">${S.guideEdit?"✅ 편집 끝내기":"✏️ 가이드 내용 고치기 (관리자)"}</button>${S.guideEdit?`<button class="btn sm soft" onclick="App.editSection(-1)">＋ 새 단계 묶음 추가</button>`:""}</div>`;
  if(S.guideEdit) o+=`<div class="alert info" style="margin-bottom:14px"><span class="ic">✏️</span><div>각 묶음을 펼치고 <b>✏️ 이 묶음 고치기</b>를 누르면 제목·설명·할 일을 고칠 수 있어요. ▲▼로 순서를 바꾸고, 할 일마다 <b>📌 안내 항목(체크 없음)</b>을 고를 수 있어요.</div></div>`;
  if(!S.myPid&&secs.length) o+=`<div class="alert info" style="margin-bottom:14px"><span class="ic">🙋</span><div style="flex:1"><b>체크하려면 내 이름을 먼저 골라 주세요</b><div style="margin-top:8px"><button class="btn sm" onclick="App.pickMe()">내 이름 고르기</button></div></div></div>`;
  else if(S.myPid&&all) o+=`<div class="card" style="margin-bottom:14px"><div class="row"><b>내 진행 상황</b><span class="sp"></span><b style="color:var(--green)">${fin} / ${all}</b></div><div class="bar" style="margin-top:8px"><i style="width:${all?Math.round(fin/all*100):0}%"></i></div>${fin===all?'<div style="margin-top:8px;color:var(--green);font-weight:700">🎉 모두 끝냈어요! 팀 리더에게 완료를 알려 주세요.</div>':""}</div>`;
  if(!secs.length) return o+`<div class="empty"><div class="ic">📄</div><b>아직 가이드가 없어요.</b><br>${isAdmin()?"위의 ‘가이드 내용 고치기’를 눌러 만들어 주세요.":"관리자가 곧 채워 줄 거예요."}</div>`;
  if(!S.openSecs){ S.openSecs={}; const f=firstOpen(secs,done); if(f>=0&&secs[f]) S.openSecs[secs[f].id||f]=true; }
  secs.forEach((s,i)=>{
    const steps=s.steps||[], tk=tasksOf(s), sf=tk.filter(st=>done[st.id]).length, allDone=tk.length&&sf===tk.length;
    const key=s.id||i;
    o+=`<details class="gsec" data-sec="${h(key)}" ontoggle="App.secToggle(this)" ${S.guideEdit||S.openSecs[key]?"open":""}><summary><span class="gnum ${allDone&&S.myPid?"done":""}">${allDone&&S.myPid?"✔":i+1}</span><span class="gt">${h(s.title)}</span><span class="gp">${!tk.length?"안내":S.myPid?`${sf}/${tk.length}`:`${tk.length}개`}</span></summary><div class="gbody">`;
    if(s.desc) o+=`<div class="gdesc">${linkify(s.desc)}</div>`;
    steps.forEach(st=>{
      if(st.info){ o+=`<div class="step info" id="st-${h(st.id)}"><span class="infoic" aria-hidden="true">📌</span><div><div class="st">${h(st.title)}</div>${st.desc?`<div class="sd">${linkify(st.desc)}</div>`:""}${st.who?`<div class="sw">🙋 담당·문의: ${linkify(st.who)}</div>`:""}</div></div>`; return; }
      const on=!!done[st.id];
      o+=`<div class="step ${on?"on":""}" id="st-${h(st.id)}"><button class="chk ${on?"on":""}" aria-label="완료 표시" onclick="App.toggleStep('${h(st.id)}')" ${S.myPid?"":"disabled"}>${on?"✔":""}</button><div><div class="st">${h(st.title)}</div>${st.desc?`<div class="sd">${linkify(st.desc)}</div>`:""}${st.who?`<div class="sw">🙋 담당·문의: ${linkify(st.who)}</div>`:""}</div></div>`;
    });
    if(S.guideEdit) o+=`<div class="row" style="margin-top:12px"><button class="btn sm soft" onclick="App.editSection(${i})">✏️ 이 묶음 고치기</button><button class="btn sm ghost" onclick="App.moveSection(${i},-1)" ${i===0?"disabled":""}>▲ 위로</button><button class="btn sm ghost" onclick="App.moveSection(${i},1)" ${i===secs.length-1?"disabled":""}>▼ 아래로</button><span class="sp"></span><button class="btn sm danger" onclick="App.delSection(${i})">삭제</button></div>`;
    o+=`</div></details>`;
  });
  return o;
}
/* 링크: 누르면 새 창으로 바로 열려요. 사내망 주소는 회사 PC에서만 열린다고 표시해요 */
function isInternal(u){ return /^https?:\/\/(\d+\.\d+\.\d+\.\d+|[^\/]*\.sec\.samsung\.net|[^\/]*\.samsungds\.net)/i.test(u); }
/* 전화번호: 누르면 바로 전화. '(외선 0 → 내선 1)', '(2→3→2)' 같은 번호도 자동으로 이어서 눌러져요 */
function telify(html){
  return html.replace(/(^|[^\d\/.:\-])((?:0\d{1,2}|1\d{3})-\d{3,4}(?:-\d{4})?)(\s*\((?:외선\s*(\d)\s*→\s*내선\s*(\d))\)|\s*\((\d(?:\s*→\s*\d)+)\))?/g,(m,pre,num,tail,ex1,ex2,seq)=>{
    let dial=num.replace(/-/g,"");
    if(ex1) dial+=","+ex1+","+ex2;
    else if(seq) dial+=","+seq.replace(/\s|→/g," ").trim().split(/\s+/).join(",");
    return `${pre}<a class="tel" href="tel:${dial}" onclick="event.stopPropagation()">📞 ${num}</a>${tail||""}`;
  });
}
function linkify(t){
  return telify(h(t)).replace(/https?:\/\/[^\s<()\[\]]+[^\s<()\[\].,;:'"]/g,raw=>{
    const u=raw.replace(/&amp;/g,"&"), href=h(u);
    return `<span class="lnk-row"><a class="lnk" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${raw}</a>${isInternal(u)?`<span class="lnk-note">사내망 전용</span>`:""}<button type="button" class="copy" onclick="event.stopPropagation();App.copy('${href}')">복사</button></span>`;
  });
}
function firstOpen(secs,done){ for(let i=0;i<secs.length;i++){ const st=tasksOf(secs[i]); if(st.length&&st.some(x=>!done[x.id])) return i; } return -1; }

      return `<button class="zbox zov ${za.length?"":"empty-z"} ${S.seatZone===z?"sel":""}" onclick="App.seatZoneSet('${h(z)}')"><h4>${h(z)}존 ${mine?"⭐":""}</h4><div class="zstat"><b>${u}</b> / ${za.length}석</div><div class="zbar"><i style="width:${za.length?Math.round(u/za.length*100):0}%"></i></div></button>`;

/* ---------- 과제 현황 ---------- */
/* 계약(과제) 기간 그래프: 지난 기간은 채워지고, 남은 날을 크게 보여 줘요 */
function ctBar(start,end,small){
  if(!end) return "";
  const left=dday(end);
  let pct=null;
  if(start){ const a=new Date(start+"T00:00:00"), b=new Date(end+"T00:00:00"), t=new Date(today()+"T00:00:00"); const tot=(b-a)/86400000; if(tot>0) pct=Math.max(0,Math.min(100,Math.round((t-a)/86400000/tot*100))); }
  const cls=left<0?"over":left<=7?"red":left<=30?"orange":"green";
  const txt=left<0?`${-left}일 지남`:left===0?"오늘 종료":`남은 ${left}일`;
  /* 초록 = 지금까지 진행된 기간 (예: 전체의 20%가 지났으면 20%만 초록) */
  const track=pct!=null?`<div class="ctb-track" title="진행 ${pct}%"><i style="width:${pct}%"></i></div>`:`<div class="ctb-track nostart"></div>`;
  if(small) return `<div class="ctb sm">${track}<span class="ctb-l ${cls}">${txt}</span></div>`;
  return `<div class="ctb"><div class="ctb-top"><span>📅 ${fmtDate(start)} ~ ${fmtDate(end)}</span><b class="ctb-l ${cls}">${pct!=null?`진행 ${pct}% · `:""}${txt}</b></div>${track}${pct==null?`<div class="ctb-hint">시작일을 넣으면 진행률이 보여요</div>`:""}</div>`;
}
function personRow(p,withProject){
  const st=P_ST[p.status]||{c:"b-gray"}, n=dday(p.contractEnd);
  const pcs=S.pcs.filter(x=>x.personId===p.id).map(x=>x.name), seat=S.seats.find(s=>s.personId===p.id);
  const period=(p.contractStart||p.contractEnd)?`📅 ${fmtDate(p.contractStart)} ~ ${fmtDate(p.contractEnd)}`:"";
  const bar=p.contractEnd?ctBar(p.contractStart,p.contractEnd,true):"";
  const meta=[withProject&&p.project?"📁 "+h(p.project):"",period,"💻 "+(pcs.length?h(pcs.join(", ")):"-"),"🪑 "+(seat?h(seatLabel(seat)):"-")].filter(Boolean).join(" · ");
  return `<button class="item" data-lp="person:${h(p.id)}" onclick="App.personDetail('${h(p.id)}')">${avatarHtml(p,38)}<div class="main"><div class="nm">${h(p.name)} <span class="badge ${st.c}">${h(p.status||"-")}</span>${p.contractEnd&&n!=null&&n<=30?` <span class="badge ${n<0?"b-red":"b-orange"}">${ddayText(n)}</span>`:""}</div><div class="meta">${meta}</div>${bar}</div><span class="arrow">›</span></button>`;
}
function vProjects(){
  let o=`<h1 class="page">📁 과제 현황</h1><p class="lead">과제 이름을 누르면 참여 멤버가 펼쳐져요. ✏️를 누르면 과제 정보와 멤버를 고칠 수 있어요.</p>`;
  o+=`<div class="row" style="margin-bottom:12px"><span class="sp"></span><button class="btn" onclick="App.editProject()">＋ 과제 추가</button></div>`;
  const none=S.people.filter(p=>!(p.project||"").trim()).sort(byName);
  let names=projectNames();
  if(!names.length&&!S.people.length) return o+`<div class="empty"><div class="ic">📁</div><b>등록된 과제가 없어요.</b><br>‘＋ 과제 추가’에서 과제명과 참여 인원을 넣어 주세요.</div>`;
  const endOf=n=>{ const pj=projByName(n)||{}; if(pj.end) return pj.end; const e=S.people.filter(p=>(p.project||"").trim()===n).map(p=>p.contractEnd).filter(Boolean).sort(); return e[e.length-1]||""; };
  const cnt=n=>S.people.filter(p=>(p.project||"").trim()===n).length;
  const SORTS=[["asc","과제명 A→Z"],["desc","과제명 Z→A"],["end","종료 임박순"],["size","인원 많은순"]];
  const so=S.projSort||"asc";
  const az=(x,y)=>String(x).localeCompare(String(y),"en",{numeric:true,sensitivity:"base"});
  if(so==="asc") names.sort(az);
  else if(so==="desc") names.sort((x,y)=>az(y,x));
  else if(so==="end") names.sort((x,y)=>{ const a=endOf(x)||"9999", b=endOf(y)||"9999"; return a.localeCompare(b)||natural(x,y); });
  else if(so==="size") names.sort((x,y)=>cnt(y)-cnt(x)||natural(x,y));
  o+=`<div class="row" style="margin-bottom:10px;gap:8px"><b style="font-size:13px">과제 ${names.length}개 · 참여 ${S.people.length-none.length}명</b><span class="sp"></span><select class="sortsel" aria-label="정렬" onchange="App.projSortSet(this.value)">${SORTS.map(([v,l])=>`<option value="${v}" ${so===v?"selected":""}>${l}</option>`).join("")}</select></div>`;
  if(!S.openProj) S.openProj={};
  o+=`<div class="row" style="margin-bottom:10px;gap:6px"><button class="btn sm ghost" onclick="App.projAll(true)">모두 펼치기</button><button class="btn sm ghost" onclick="App.projAll(false)">모두 접기</button></div>`;
  const grp=(key,title,arr,info,extra,bar)=>{
    const open=!!S.openProj[key];
    return `<div class="grp"><div class="grp-h pj"><button class="pjt" data-key="${h(key)}" onclick="App.projToggle(this.dataset.key)" aria-expanded="${open}"><span class="caret">${open?"▾":"▸"}</span><span class="pjn"><b>${title}</b><span class="pjb"><span class="badge b-gray">${arr.length}명</span>${extra||""}</span></span></button>${key!=="__none"?`<button class="pje" data-name="${h(key)}" onclick="App.editProject(this.dataset.name)" aria-label="과제 정보 고치기">✏️</button>`:""}</div>`+
      (info?`<div class="muted pjinfo">${info}</div>`:"")+(bar?`<div class="pjbar">${bar}</div>`:"")+
      (open?(arr.length?arr.map(p=>personRow(p,false)).join(""):`<div class="muted" style="padding:12px 14px;font-size:13px">참여 인원이 없어요. ✏️를 눌러 멤버를 넣어 주세요.</div>`):"")+`</div>`;
  };
  names.forEach(k=>{
    const pj=projByName(k)||{}, arr=S.people.filter(p=>(p.project||"").trim()===k).sort(byName), tt=arr.filter(p=>p.status==="테라타워 근무").length;
    const last=endOf(k), dd=last?dday(last):null;
    const info=[pj.ipType?"🧩 "+h(pj.ipType):"",pj.process?"⚙️ "+h(pj.process):"",pj.client?"🏢 "+h(pj.client):"",pj.place?"📍 "+h(pj.place):""].filter(Boolean).join(" · ");
    const starts=arr.map(p=>p.contractStart).filter(Boolean).sort(), pStart=pj.start||starts[0]||"", pEnd=pj.end||last;
    o+=grp(k,"📁 "+h(k),arr,info,(pj.ipType?`<span class="badge b-purple">${h(pj.ipType)}</span>`:"")+(tt?`<span class="badge b-blue">테라타워 ${tt}</span>`:"")+(last&&dd!=null&&dd<=30?`<span class="badge ${dd<0?"b-red":"b-orange"}">${ddayText(dd)}</span>`:""),pEnd?ctBar(pStart,pEnd):"");
  });
  if(none.length) o+=grp("__none","🕓 과제 배정 안 됨",none,"","");
  return o;
}

  if(!S.people.length) o+=`<div class="empty"><div class="ic">👥</div><b>등록된 사람이 없어요.</b><br>‘＋ 사람 추가’로 회사 인원을 넣어 주세요.</div>`;
  else if(!list.length) o+=`<div class="empty">찾는 사람이 없어요.</div>`;

    const st=P_ST[p.status]||{c:"b-gray"};

    const line2=[p.contact?"📞 "+h(p.contact):"",p.email?"✉️ "+h(p.email):""].filter(Boolean).join(" · ");
    return `<button class="item" data-lp="person:${h(p.id)}" onclick="App.personDetail('${h(p.id)}')">${avatarHtml(p,42)}<div class="main"><div class="nm">${h(p.name)}${line1?` <span class="muted" style="font-weight:500;font-size:13px">${line1}</span>`:""} <span class="badge ${st.c}">${h(p.status||"-")}</span></div><div class="meta">📁 ${h(p.project||"배정 안 됨")}</div>${line2?`<div class="meta">${line2}</div>`:""}</div><span class="arrow">›</span></button>`;
  }).join("")+`</div>`;
  return bodyOnly?o:head+`<div id="sbody">${o}</div>`;
}

/* ---------- 모달 ---------- */
/* 창(모달)은 휴대폰 뒤로가기로 닫혀요: 창을 열 때 기록을 하나 넣고, 뒤로가기가 오면 창만 닫아요 */
const MH={open:false,expectPop:false,pendingHash:null};
function openModal(inner){
  $("modal").innerHTML=`<div class="ov" onclick="if(event.target===this)App.close()"><div class="sheet" role="dialog">${inner}</div></div>`;
  document.body.style.overflow="hidden";
  if(!MH.open){ MH.open=true; try{ history.pushState({ndModal:1},""); }catch(e){} }
}
function closeModal(fromPop){
  $("modal").innerHTML=""; document.body.style.overflow="";
  if(!MH.open) return;
  MH.open=false;
  if(fromPop!==true){ MH.expectPop=true; try{ history.back(); }catch(e){ MH.expectPop=false; } }
}
function goTo(hash){ if(MH.open){ MH.pendingHash=hash; closeModal(); } else location.hash=hash; }
window.addEventListener("popstate",()=>{
  if(MH.expectPop){ MH.expectPop=false; if(MH.pendingHash){ const x=MH.pendingHash; MH.pendingHash=null; location.hash=x; } return; }
  if(MH.open) closeModal(true);
});
function personOptions(sel,emptyLabel){
  return `<option value="">${emptyLabel||"(아무도 없음)"}</option>`+S.people.slice().sort(byName).map(p=>`<option value="${h(p.id)}" ${p.id===sel?"selected":""}>${h(p.name)}${p.status&&p.status!=="테라타워 근무"?" ("+h(p.status)+")":""}</option>`).join("");
}
function optButtons(name,list,cur){
  return `<div class="opts" data-opt="${name}">`+list.map(k=>`<button type="button" class="opt ${k===cur?"on":""}" data-v="${h(k)}" onclick="App.opt(this)">${h(k)}</button>`).join("")+`</div><input type="hidden" id="${name}" value="${h(cur||"")}">`;
}

  async _saveSeat(id){
    const s=S.seats.find(x=>x.id===id); const pid=val("stPid")||null;

    const dup=S.seats.find(x=>x.id!==id&&seatFloor(x)===floor&&seatZone(x)===zone&&(x.row||"")===row&&String(x.num)===String(num));
    if(dup){ toast(`${floor}층 ${zone}존 ${seatCode({row,num})}은 이미 있어요`); return; }
    const ok=await write(async db=>{

  _delSeatAsk(id){ if(!isAdmin()){ needAdmin(()=>App._delSeatAsk(id),"좌석 삭제"); return; } const s=S.seats.find(x=>x.id===id); openModal(`<h3>이 자리를 없앨까요?</h3><p class="hint">${h(seatLabel(s))} 자리가 배치도에서 사라져요.</p><div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn danger" onclick="App._delSeat('${h(id)}')">없애기</button></div>`); },

    openModal(`<h3>＋ 좌석 입력</h3><p class="hint">층 → 존 → 열 → 번호 순서로 골라 주세요. 예) 4층 D존 I열 01번 = <b>4층 D존 I01</b>. ‘끝 번호’를 고르면 한 줄을 한 번에 만들 수 있어요.</p>

      <div class="f"><label>앉을 사람 <em>(한 자리만 넣을 때, 선택)</em></label><select id="szPid">${personOptions("","(빈자리로 두기)")}</select></div>
      <div class="notice" id="szPrev"></div>
      <div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn" onclick="App._mkSeats()">저장</button></div>`);
    const prev=()=>{ const f=val("szFloor"), z=val("szZone"), r=val("szRow"), a=parseInt(val("szFrom"),10), t=val("szTo"); const e=$("szPrev"); if(!e) return;
      e.textContent=`📍 ${f||"?"}층 ${z}존 ${r}${String(a).padStart(2,"0")}`+(t&&parseInt(t,10)>a?` ~ ${r}${String(t).padStart(2,"0")} (${parseInt(t,10)-a+1}자리)`:""); };
    ["szFloor","szRow","szFrom","szTo"].forEach(i=>{ const e=$(i); if(e){ e.addEventListener("input",prev); e.addEventListener("change",prev); } });
    document.querySelectorAll('[data-opt="szZone"] .opt').forEach(b=>b.addEventListener("click",()=>setTimeout(prev,0)));

  async _mkSeats(){
    const floor=val("szFloor"), zone=val("szZone"), row=val("szRow"), a=parseInt(val("szFrom"),10), bRaw=val("szTo"), b=bRaw?parseInt(bRaw,10):a, pid=val("szPid")||null;
    if(!floor){ toast("층을 넣어 주세요"); return; }
    if(!zone){ toast("존을 골라 주세요"); return; }
    if(!(a>=1&&b>=a&&b<=16)){ toast("끝 번호는 시작 번호보다 커야 해요"); return; }
    const exist=new Set(S.seats.filter(s=>seatFloor(s)===floor&&seatZone(s)===zone&&(s.row||"")===row).map(s=>String(s.num)));
    let made=0;
    const ok=await write(async db=>{
      if(pid&&a===b){ for(const o of S.seats.filter(x=>x.personId===pid)) await db.doc("seats/"+o.id).set(Object.assign({},stripId(o),{personId:null})); }
      for(let n=a;n<=b;n++){ if(exist.has(String(n))) continue; made++; await db.doc("seats/"+uidGen()).set({floor,zone,row,num:n,personId:(pid&&a===b)?pid:null,note:"",updated:today()}); }
    },null);
    if(ok){ closeModal(); S.seatFloor=floor; S.seatZone=zone; render(); toast(made?`${floor}층 ${zone}존 ${row}열에 ${made}자리를 만들었어요`:"이미 있는 자리예요"); }
  },

  async _naGo(){

    S.adminPw=pw;
    try{ const j=await api({action:"ping"}); if(!j.admin){ S.adminPw=""; toast("관리자 비밀번호가 맞지 않아요"); return; } }
    catch(e){ S.adminPw=""; toast("연결하지 못했어요"); return; }
    S.adminOk=true; ls.set(LS_ADMIN,pw); closeModal(); render(); toast("관리자 모드를 켰어요");
    const f=App._afterAdmin; App._afterAdmin=null; if(f) setTimeout(f,150);
  },

    if(isNew&&S.people.some(p=>(p.name||"").trim()===nm)){ toast("이미 목록에 있는 이름이에요. 목록에서 골라 주세요"); return; }
    if(isNew) pid=uidGen();
    const old=isNew?{}:person(pid)||{};
    const pBody=Object.assign({},stripId(old),{name:isNew?nm:old.name,status:val("miSt")||"테라타워 근무",project:projVal("miProj"),contact:val("miTel"),updated:today()});
    const floor=val("miFloor"), zone=val("miZone"), row=val("miRow"), numS=val("miNum");
    const seatAny=floor||row||numS, seatAll=floor&&zone&&row&&numS;
    if(seatAny&&!seatAll){ toast("자리는 층 · 존 · 열 · 번호를 모두 골라 주세요"); return; }
    const pcSel=val("miPc");
    if(pcSel==="__new"&&!val("miPcName")){ toast("새 PC 이름을 넣어 주세요"); return; }
    const myName=pBody.name;
    const ok=await write(async db=>{
      await db.doc("people/"+pid).set(pBody);
      if(seatAll){
        const num=parseInt(numS,10);
        let target=S.seats.find(s=>seatFloor(s)===floor&&seatZone(s)===zone&&(s.row||"")===row&&String(s.num)===String(num));
        if(target&&target.personId&&target.personId!==pid){ throw {code:"seatTaken",who:pname(target.personId)}; }
        for(const o of S.seats.filter(x=>x.personId===pid&&(!target||x.id!==target.id))) await db.doc("seats/"+o.id).set(Object.assign({},stripId(o),{personId:null}));
        if(target) await db.doc("seats/"+target.id).set(Object.assign({},stripId(target),{personId:pid,updated:today()}));
        else await db.doc("seats/"+uidGen()).set({floor,zone,row,num,personId:pid,note:"",updated:today()});
      }
      if(pcSel){
        const fields={model:val("miModel"),mfgNo:val("miMfg"),serial:val("miSerial"),mac:val("miMac"),ip:val("miIp")};
        if(pcSel==="__new"){
          await db.doc("pcs/"+uidGen()).set(Object.assign({name:val("miPcName"),status:"사용중",personId:pid,inDate:today(),note:"",history:[{date:today(),from:"",to:myName,status:"사용중",memo:"내 정보에서 등록",by:myName}],updated:today()},fields));
        } else {
          const pc=S.pcs.find(x=>x.id===pcSel); const hist=pc.personId===pid?(pc.history||[]):(pc.history||[]).concat([{date:today(),from:pname(pc.personId)||"",to:myName,status:"사용중",memo:"내 정보에서 변경",by:myName}]).slice(-60);
          await db.doc("pcs/"+pc.id).set(Object.assign({},stripId(pc),fields,{personId:pid,status:"사용중",history:hist,updated:today()}));
        }
      }
    },null);
    if(ok){ if(!S.myPid||isNew) setMe(pid); closeModal(); render(); toast("내 정보를 저장했어요"); }
  },

        await db.doc("pcs/"+x.id).set(Object.assign({},stripId(x),{personId:null,status:"대기",history:hist,updated:today()}));
      }
      for(const s of S.seats.filter(s=>s.personId===pid)) await db.doc("seats/"+s.id).set(Object.assign({},stripId(s),{personId:null}));
    },"PC와 좌석을 비웠어요");
    if(ok) closeModal();
  },
  delPerson(id){ if(!isAdmin()){ needAdmin(()=>App.delPerson(id),"사람 삭제"); return; } const p=person(id); openModal(`<h3>정말 지울까요?</h3><p class="hint">‘${h(p.name)}’님 정보가 지워져요. 회사를 아예 떠난 경우에만 지우세요. (외부 과제는 상태만 바꾸면 돼요)</p><div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn danger" onclick="App._delPerson('${h(id)}')">지우기</button></div>`); },
  async _delPerson(id){
    const ok=await write(async db=>{
      for(const x of S.pcs.filter(x=>x.personId===id)) await db.doc("pcs/"+x.id).set(Object.assign({},stripId(x),{personId:null,status:x.status==="사용중"?"대기":x.status}));
      for(const s of S.seats.filter(s=>s.personId===id)) await db.doc("seats/"+s.id).set(Object.assign({},stripId(s),{personId:null}));
      await db.doc("people/"+id).delete();
    },"지웠어요");
    if(ok){ if(S.myPid===id) setMe(null); closeModal(); }
  },

  /* 로그인 · 관리자 */
  saveApi(){ const u=val("apiUrl"); if(!/^https:\/\/script\.google\.com\//.test(u)){ toast("구글 Apps Script 주소를 넣어 주세요"); return; } S.api=u; ls.set(LS_API,u); S.err=null; load(); },
  async login(){
    const pw=val("loginPw"); if(!pw){ toast("비밀번호를 넣어 주세요"); return; }
    S.pw=pw; S.err=null; S.connected=false; render();
    try{ await api({action:"ping"}); ls.set(LS_PW,pw); load(); }
    catch(e){ S.pw=""; S.err="login"; render(); toast(e.code==="auth"?"비밀번호가 맞지 않아요":"연결하지 못했어요. 인터넷을 확인해 주세요."); }
  },
  logout(){ S.pw=""; S.adminPw=""; S.adminOk=false; ls.set(LS_PW,""); ls.set(LS_ADMIN,""); S.connected=false; S.err="login"; render(); },
  async adminOn(){
    const pw=val("adPw"); if(!pw){ toast("관리자 비밀번호를 넣어 주세요"); return; }
    S.adminPw=pw;
    try{ const j=await api({action:"ping"}); if(j.admin){ S.adminOk=true; ls.set(LS_ADMIN,pw); toast("관리자 모드를 켰어요"); } else { S.adminPw=""; toast("관리자 비밀번호가 맞지 않아요"); } }
    catch(e){ S.adminPw=""; toast("연결하지 못했어요"); }
    render();
  },
  adminOff(){ S.adminPw=""; S.adminOk=false; S.guideEdit=false; ls.set(LS_ADMIN,""); render(); toast("관리자 모드를 껐어요"); },

  /* 백업 */
  async exportXlsx(){
    if(!window.XLSX){ toast("엑셀 도구를 불러오는 중이에요. 잠시 후 다시 눌러 주세요."); return; }
    const X=window.XLSX, wb=X.utils.book_new();
    const add=(name,rows)=>{ const ws=X.utils.json_to_sheet(rows.length?rows:[{"(비어 있음)":""}]); X.utils.book_append_sheet(wb,ws,name); };
    add("사람",S.people.slice().sort(byName).map(p=>({"이름":p.name,"영문 이름":p.nameEn||"","직급":p.rank||"","상태":p.status,"과제":p.project||"","계약시작":p.contractStart||"","계약종료":p.contractEnd||"","연락처":p.contact||"","개인 이메일":p.email||"","Knox 메일":p.knox||"","RBS/SSO ID":p.ssoId||"","VWP/TOSS ID":p.vwpId||"","메모":p.note||""})));
    add("PC",S.pcs.slice().sort((a,b)=>natural(a.name||"",b.name||"")).map(p=>({"PC이름":p.name,"상태":p.status,"사용자":pname(p.personId),"모델명":p.model||"","제조번호":p.mfgNo||"","시리얼넘버":p.serial||"","MAC 주소":p.mac||"","IP 주소":p.ip||"","반입일":p.inDate||"","메모":p.note||""})));
    add("과제",projectNames().map(n=>{ const pj=projByName(n)||{}; return {"과제":n,"IP 종류":pj.ipType||"","공정":pj.process||"","고객사(부서)":pj.client||"","장소":pj.place||"","시작":pj.start||"","종료":pj.end||"","참여 인원":S.people.filter(p=>(p.project||"").trim()===n).map(p=>p.name).join(", "),"메모":pj.note||""}; }));
    const hist=[]; S.pcs.forEach(p=>(p.history||[]).forEach(x=>hist.push({"PC이름":p.name,"날짜":x.date,"이전 사용자":x.from,"새 사용자":x.to,"상태":x.status||"","메모":x.memo||"","기록한 사람":x.by||""})));
    hist.sort((a,b)=>(a["날짜"]||"").localeCompare(b["날짜"]||"")); add("PC변경기록",hist);
    add("좌석",S.seats.slice().sort((a,b)=>natural(seatFloor(a)+seatZone(a)+seatSortKey(a),seatFloor(b)+seatZone(b)+seatSortKey(b))).map(s=>({"층":seatFloor(s),"존":seatZone(s),"열":s.row||"","번호":s.num,"좌석":seatCode(s),"사용자":pname(s.personId),"메모":s.note||""})));
    const g=[]; gSections().forEach((s,i)=>(s.steps||[]).forEach((st,k)=>g.push({"단계":`${i+1}. ${s.title}`,"순서":k+1,"할 일":st.title,"설명":st.desc||"","담당·문의":st.who||""}))); add("입주가이드",g);
    try{ X.writeFile(wb,`나노디자인_백업_${today()}.xlsx`); toast("엑셀 파일을 받았어요"); }
    catch(e){ toast("파일을 받지 못했어요"); }
  }
};
/* 길게 누르기: 사람·PC 목록에서 0.6초 누르면 고치기/삭제 메뉴 */
(function(){
  let t=null, el=null, sx=0, sy=0, fired=false;
  const clear=()=>{ clearTimeout(t); t=null; if(el) el.classList.remove("pressing"); el=null; };
  document.addEventListener("pointerdown",e=>{
    const x=e.target.closest("[data-lp]"); if(!x) return;
    clear(); fired=false; el=x; sx=e.clientX; sy=e.clientY; x.classList.add("pressing");
    t=setTimeout(()=>{ fired=true; const [kind,id]=x.dataset.lp.split(":"); clear(); if(navigator.vibrate) try{navigator.vibrate(20);}catch(_){} App.lpMenu(kind,id); },600);
  });
  document.addEventListener("pointermove",e=>{ if(el&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)) clear(); });
  ["pointerup","pointercancel","scroll"].forEach(ev=>document.addEventListener(ev,clear,true));
  document.addEventListener("click",e=>{ if(fired&&e.target.closest("[data-lp]")){ e.preventDefault(); e.stopPropagation(); fired=false; } },true);
  document.addEventListener("contextmenu",e=>{ if(e.target.closest("[data-lp]")) e.preventDefault(); });
})();
/* 관리자만 할 수 있는 일: 그 자리에서 관리자 비밀번호를 넣으면 바로 이어서 해요 */
function needAdmin(after,what){
  App._afterAdmin=after||null;
  openModal(`<h3>🔒 관리자 비밀번호가 필요해요</h3><p class="hint">${h(what||"삭제")}는 실수를 막기 위해 관리자만 할 수 있어요. 관리자 비밀번호를 넣어 주세요.</p>
    <div class="f"><input id="naPw" type="password" placeholder="관리자 비밀번호" onkeydown="if(event.key==='Enter')App._naGo()"></div>
    <div class="actions"><button class="btn ghost" onclick="App.close()">취소</button><button class="btn" onclick="App._naGo()">확인</button></div>`);
  setTimeout(()=>{ const e=$("naPw"); if(e) e.focus(); },50);
}
/* ---------- 사진 (구글 드라이브에 저장, 팀 비밀번호로만 볼 수 있어요) ---------- */
function photoSection(kind,id,photos){
  photos=photos||[];
  return `<b>📷 사진 ${photos.length?`(${photos.length})`:""}</b><div class="phs">${photos.map(p=>`<button type="button" class="ph" data-kind="${kind}" data-id="${h(id)}" onclick="App.photoView('${kind}','${h(id)}','${h(p.id)}')"><img data-fid="${h(p.id)}" alt="사진"></button>`).join("")}<button type="button" class="ph add" onclick="App.photoPick('${kind}','${h(id)}')">＋ 사진<br>찍기·추가</button></div><input type="file" accept="image/*" id="phInput" style="display:none" onchange="App.photoUpload('${kind}','${h(id)}',this)">`;
}
async function photoData(fid){
  if(S.photoCache[fid]) return S.photoCache[fid];
  const j=await api({action:"photoGet",fileId:fid});
  return (S.photoCache[fid]=`data:${j.mime||"image/jpeg"};base64,${j.data}`);
}
const PHOTO_ERR={bad:"서버에서 사진을 찾지 못했어요",drive:"구글 드라이브 권한 문제예요",nofile:"드라이브에서 사진 파일이 지워졌어요",net:"인터넷 연결 문제예요"};
function loadThumbs(){
  document.querySelectorAll("#modal img[data-fid]").forEach(async img=>{
    const btn=img.closest(".ph");
    try{
      img.src=await photoData(img.dataset.fid);
      ensureAvatar(btn&&btn.dataset.kind,btn&&btn.dataset.id,img.dataset.fid);
    }catch(e){
      const sp=document.createElement("span"); sp.className="phfail";
      sp.innerHTML=`불러오기 실패<br><small>${h(PHOTO_ERR[e&&e.code]||"잠시 후 다시")}</small><br>↻ 다시`;
      img.replaceWith(sp);
      if(btn) btn.onclick=ev=>{ ev.stopPropagation(); delete S.photoCache[img.dataset.fid]; sp.replaceWith(img); img.removeAttribute("src"); loadThumbs(); };
    }
  });
}
/* 사람 목록에 보일 작은 얼굴 사진(아바타): 시트에 바로 저장해서 드라이브를 거치지 않고 바로 보여요 */
function makeThumb(dataUrl,size){
  return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement("canvas"), s=Math.min(im.width,im.height); c.width=c.height=size; c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size); res(c.toDataURL("image/jpeg",0.72)); }; im.onerror=()=>res(""); im.src=dataUrl; });
}
async function ensureAvatar(kind,id,fid){
  if(kind!=="person"||!id||S.saving) return;
  const p=person(id); if(!p||p.avatar||!(p.photos||[]).some(x=>x.id===fid)) return;
  const t=await makeThumb(S.photoCache[fid],120); if(!t) return;
  await write(db=>db.doc("people/"+id).set(Object.assign({},stripId(p),{avatar:t,avatarOf:fid})),null,true);
}
function avatarHtml(p,size){
  size=size||40;
  return p&&p.avatar?`<img class="avatar" src="${p.avatar}" alt="" style="width:${size}px;height:${size}px">`:`<span class="avatar ph0" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.45)}px">${h(((p&&p.name)||"?").slice(0,1))}</span>`;
}
function shrinkImage(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas");
      c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.8));
    }; im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
const recOf=(kind,id)=>kind==="pc"?S.pcs.find(x=>x.id===id):person(id);
function stripId(o){ const c=Object.assign({},o); delete c.id; return c; }
function focusSearch(){ const el=document.querySelector(".search"); if(el){ el.focus(); const v=el.value; el.setSelectionRange(v.length,v.length); } }
window.App=App;

route();
start();
})();
